      }
      function sort(sels, t) {
        tl.to(sels, { xPercent: -8, opacity: 0, duration: 0.3, stagger: 0.05, ease: "power2.in" }, t);
      }
      function flash(t, pic) {
        tl.fromTo("#hb-flash", { opacity: 0 }, { opacity: pic || 0.85, duration: 0.06, ease: "none" }, t - 0.03);
        tl.to("#hb-flash", { opacity: 0, duration: 0.26, ease: "power2.out" }, t + 0.03);
      }

      // pied de page : présent dès la première image ; barre de progression jusqu'à la carte de fin

      tl.fromTo("#hb-accroche .la", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.35);
      tl.fromTo("#hb-accroche .titre", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power4.out" }, 0.45);
      tl.fromTo("#hb-accroche .titre span", { yPercent: 70, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.42, ease: "power3.out" }, 0.58);

      entre("#hb-k2", 1.75);

      // 6 s, la musique part : temps d'échange, de coordination et de suivi de dossiers

      entre("#hb-m1b", 6.8);
      entre("#hb-m1c", 7.6);
      sort(["#hb-m1a", "#hb-m1b", "#hb-m1c"], 13.4);

      flash(14);
      // pour un accompagnement plus efficace de vos entreprises (en bas : le portrait et le kakémono restent visibles)
      entre("#hb-m2a", 16.0);
      entre("#hb-m2b", 16.8);
      entre("#hb-m2c", 17.6);
      sort(["#hb-m2a", "#hb-m2b", "#hb-m2c"], 21.5);
      flash(22);
      flash(24);
      // excellent lundi et bonne semaine productive à tous

      entre("#hb-m3b", 25.2);
      entre("#hb-m3c", 26.0);
      sort(["#hb-m3a", "#hb-m3b", "#hb-m3c"], 30.8);

      entre("#hb-m4b", 32.8);
      entre("#hb-m4c", 33.6);
