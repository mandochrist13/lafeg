  <div id="root" data-composition-id="s3" data-width="1920" data-height="1080">
    <div id="s3-stage">
      <div id="s3-cam">
        <div id="s3-inside">
          <div style="position: absolute; left: 0; top: 380px; width: 400px; height: 180px; background: #d8e3dc; clip-path: polygon(0 26%, 100% 0, 100% 100%, 0 100%)"></div>

          <div id="s3-p4" class="s3-page"><img src="assets/img/dossier-04.png" alt="" /></div>
          <div id="s3-p6" class="s3-page">
            <img src="assets/img/dossier-06.png" alt="" />
            <svg class="s3-abs" width="380" height="537" viewBox="0 0 380 537" style="overflow: visible">
              <path id="s3-tick" d="M 291,168 L 298,176 L 312,158" fill="none" stroke="#0A7537" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </div>
          <div id="s3-p9" class="s3-page">

            <svg class="s3-abs" width="380" height="537" viewBox="0 0 380 537" style="overflow: visible">
              <g id="s3-cachet" opacity="0" style="mix-blend-mode: multiply" data-layout-ignore>
                <circle cx="196" cy="401" r="36" fill="none" stroke="#0A7537" stroke-width="3.5" />
                <circle cx="196" cy="401" r="29" fill="none" stroke="#0A7537" stroke-width="1.6" />
                <text x="196" y="397" text-anchor="middle" font-family="Hyundai Sans Head" font-weight="700" font-size="10.5" fill="#0A7537">VOTRE</text>
                <text x="196" y="410" text-anchor="middle" font-family="Hyundai Sans Head" font-weight="700" font-size="10.5" fill="#0A7537">ENTREPRISE</text>

          <div id="s3-j0" class="s3-just" data-layout-allow-overlap style="left: 1238px; top: 302px; transform: rotate(-0.5deg)">
            <div class="jk" data-layout-ignore>Pièce justificative</div>
            <div class="jt">Fiche circuit</div>
            <div class="fr"><i></i><b style="width: 200px"></b></div>

            <path d="M 1426,330 L 1426,272 C 1426,258 1450,258 1450,272 L 1450,338 C 1450,352 1434,352 1434,338 L 1434,284" fill="none" stroke="#8A9590" stroke-width="5" stroke-linecap="round" />

    <div id="s3-k1" class="s3-kick">Étape 1 · Le dossier</div>
    <div id="s3-k2" class="s3-kick">Étape 2 · Les justificatifs</div>
    <div id="s3-l1" class="s3-lab"><span>Lettre</span> <span>de</span> <span>demande</span></div>
    <div id="s3-l2" class="s3-lab"><span>Fiche</span> <span>entreprise</span></div>
    <div id="s3-l3" class="s3-lab"><span>Fédération</span> <span>métier</span><div class="s3-sub">une seule case cochée</div></div>
    <div id="s3-l4" class="s3-lab"><span>Déclaration</span> <span>d'engagement</span><div class="s3-sub">Charte d'éthique de la FEG</div></div>
    <div id="s3-l5" class="s3-lab"><span>Signature</span> <span>et</span> <span>cachet</span></div>
    <div id="s3-l6" class="s3-lab"><span>Joindre</span> <span>les</span> <span>justificatifs</span><div class="s3-sub">CNSS · CNAMGS · Fiche circuit</div></div>
  </div>
  <script>
    (function () {
      var C = window.__FEG_CUES;
      var P = window.FEGP;
      var L = C.local("s3");
      var D = C.sc.s3.dur;
      document.getElementById("s3-cover").innerHTML = P.folderTop(400, 560);
      // main au stylo (droite) et main au cachet (droite), vues de dessus
      var round =
        '<div style="position:absolute;left:-48px;top:-48px;width:96px;height:96px;border-radius:50%;background:#3A4540;box-shadow:0 6px 14px rgba(0,0,0,.18)">' +
        '<div style="position:absolute;left:10px;top:9px;right:10px;bottom:13px;border-radius:50%;background:#46524C"></div></div>' +
        '<div style="position:absolute;left:-26px;top:-26px;width:52px;height:52px;border-radius:50%;background:#2B3330"></div>';
      document.getElementById("s3-hands").innerHTML =
        P.armTop("s3pen", { pose: "pen", hand: "R", s: 0.9, r: -20 }) + P.armTop("s3st", { pose: "grip", hand: "R", s: 0.9, r: -25, under: round });
      // repères : pointe du stylo en (45,-551), prise en (0,-470) dans le repère du bras
      function off(px, py, s, r) {
        var a = (r * Math.PI) / 180;
        return { x: s * (px * Math.cos(a) - py * Math.sin(a)), y: s * (px * Math.sin(a) + py * Math.cos(a)) };
      }
      var penO = off(-80, -600, 0.9, -20),
        stO = off(0, -470, 0.9, -25);
      function penAt(x, y) {
        return { x: x - penO.x, y: y - penO.y };
      }
      function stAt(x, y) {
        return { x: x - stO.x, y: y - stO.y };
      }
      var tl = gsap.timeline({ paused: true });

      // raccord : dossier fermé centré (360 × 504) puis il s'ouvre et prend sa place
      gsap.set("#s3-cam", { transformOrigin: "1420px 540px", scale: 0.9, x: -460, y: 0 });
      gsap.set("#s3-inside", { scaleX: 0, transformOrigin: "100% 50%" });
      gsap.set("#s3-cover", { transformOrigin: "0% 50%" });
      ["#s3-p3", "#s3-p4", "#s3-p6", "#s3-p9", "#s3-j0", "#s3-j1", "#s3-j2"].forEach(function (s) {
        gsap.set(s, { x: 760, rotation: 8, opacity: 0 });
      });
      gsap.set("#s3-clip", { y: -60, opacity: 0 });
      gsap.set("#s3-tick", { strokeDasharray: 40, strokeDashoffset: 40 });
      gsap.set("#s3-sign", { strokeDasharray: 260, strokeDashoffset: 260 });
      // mains garées sous le cadre (plus bas en vertical, où l'on voit sous le plateau)
      var p0 = penAt(1700, P.V ? 1800 : 1500),
        s0 = stAt(1720, P.V ? 1800 : 1500);
      gsap.set("#s3pen", { x: p0.x, y: p0.y });
      gsap.set("#s3st", { x: s0.x, y: s0.y });
      gsap.set("#s3st-arm", { scale: 1.07, transformOrigin: "0px -470px" });

      var tOpen = L(C.at("L04", ["Remplissez"]) + 0.05);
      tl.to("#s3-cover", { scaleX: 0, duration: 0.22, ease: "power2.in" }, tOpen)
        .set("#s3-cover", { autoAlpha: 0 }, tOpen + 0.22)
        .to("#s3-inside", { scaleX: 1, duration: 0.26, ease: "power2.out" }, tOpen + 0.22)
        .to("#s3-cam", { scale: 1, x: 0, y: 0, duration: 0.9, ease: "power2.inOut" }, tOpen + 0.05);
      tl.to("#s3-k1", { opacity: 1, duration: 0.2, ease: "power2.out" }, tOpen + 0.3);

      // libellés : un seul à la fois, entrée mot à mot, sortie floue
      function lab(sel, tIn, tOut) {
        tl.fromTo(sel + " span", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.067, ease: "power4.out" }, tIn);
        if (document.querySelector(sel + " .s3-sub")) tl.fromTo(sel + " .s3-sub", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, arguments[3] != null ? arguments[3] : tIn + 0.5);
        tl.to(sel, { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power3.in" }, tOut);
      }
      // une feuille arrive en glissant ; elle est opaque presque tout de suite (le papier ne laisse pas voir la page dessous)
      function page(sel, t) {
        tl.to(sel, { opacity: 1, duration: 0.1, ease: "power1.out" }, t);
        tl.to(sel, { x: 0, rotation: 0, duration: 0.5, ease: "power3.out" }, t);
      }
      var tLet = L(C.at("L04", ["lettre"]) - 0.15),
        tFic = L(C.at("L04", ["fiche"]) - 0.12),
        tFed = L(C.at("L04", ["choix"]) - 0.1),
        tDec = L(C.at("L05", ["déclaration", "declaration"]) - 0.15),
        tCha = L(C.at("L05", ["charte"]) - 0.05),
        tCac = L(C.at("L05", ["apposez"]) - 0.05),
        tJoi = L(C.at("L06", ["Joignez"]) - 0.1);
      page("#s3-p3", tLet);
      lab("#s3-l1", tLet + 0.05, tFic - 0.25);
      page("#s3-p4", tFic);
      lab("#s3-l2", tFic + 0.05, tFed - 0.25);
      page("#s3-p6", tFed);
      lab("#s3-l3", tFed + 0.05, tDec - 0.3, tFed + 0.5);
      // le stylo coche « Logistique et manutention »
      var tTick = L(C.at("L04", ["métier", "metier"], "e")) + 0.15;
      var pk = penAt(1230 + 291, 272 + 168);
      tl.to("#s3pen", { x: pk.x, y: pk.y, duration: 0.55, ease: "power2.inOut" }, tTick - 0.6)
        .to("#s3-tick", { strokeDashoffset: 0, duration: 0.22, ease: "power1.inOut" }, tTick)
        .to("#s3pen", { x: "+=22", y: "-=10", duration: 0.22, ease: "power1.inOut" }, tTick);
      page("#s3-p9", tDec);
      lab("#s3-l4", tDec + 0.05, tCac - 0.3, tCha);
      // signature
      var tSig = tCha + 0.15;
      var ps = penAt(1230 + 252, 272 + 394);
      tl.to("#s3pen", { x: ps.x, y: ps.y, duration: 0.6, ease: "power2.inOut" }, tSig - 0.7)
        .to("#s3-sign", { strokeDashoffset: 0, duration: 1.1, ease: "none" }, tSig)
        .to("#s3pen", { keyframes: [{ x: ps.x + 18, y: ps.y - 8, duration: 0.25 }, { x: ps.x + 36, y: ps.y + 2, duration: 0.25 }, { x: ps.x + 52, y: ps.y - 6, duration: 0.25 }, { x: ps.x + 70, y: ps.y - 6, duration: 0.35 }], ease: "none" }, tSig)
        .to("#s3pen", { x: p0.x, y: p0.y, duration: 0.6, ease: "power2.in" }, tSig + 1.25);
      // cachet
      lab("#s3-l5", tCac + 0.05, tJoi - 0.35);
      var hitC = L(C.at("L05", ["cachet"]) + 0.08);
      var sc = stAt(1230 + 196, 272 + 401);
      tl.to("#s3st", { x: sc.x, y: sc.y, duration: 0.65, ease: "power2.inOut" }, hitC - 0.85)
        .to("#s3st-arm", { scale: 1.12, duration: 0.12, ease: "power2.out" }, hitC - 0.18)
        .to("#s3st-arm", { scale: 1.0, duration: 0.06, ease: "power4.in" }, hitC - 0.06)
        .set("#s3-cachet", { opacity: 0.9 }, hitC)
        .to("#s3st-arm", { scale: 1.07, duration: 0.2, ease: "power2.out" }, hitC + 0.06)
        .to("#s3st", { x: s0.x, y: s0.y, duration: 0.6, ease: "power2.in" }, hitC + 0.35);

      // étape 2 : la fiche circuit et les justificatifs CNSS et CNAMGS, posés dans l'ordre où la voix les nomme
      // (la dernière nommée passe dessus), un trombone, le dossier se ferme et se soulève
      var just = [
        { sel: "#s3-j0", t: L(C.at("L06", ["ainsi"]) - 0.1), name: "Fiche circuit" },
        { sel: "#s3-j1", t: L(C.at("L06", ["CNSS", "cnss"]) - 0.3), name: "CNSS" },
        { sel: "#s3-j2", t: L(C.at("L06", ["CNAMGS", "cnamgs", "knam"]) - 0.3), name: "CNAMGS" },
      ].sort(function (a, b) {
        return a.t - b.t;
      });
      var clipEl = document.getElementById("s3-clip");
      document.querySelector("#s3-l6 .s3-sub").textContent = just
        .map(function (j) {
          return j.name;
        })
        .join(" · ");
      tl.to("#s3-k1", { opacity: 0, duration: 0.2, ease: "power2.in" }, tJoi - 0.3).to("#s3-k2", { opacity: 1, duration: 0.2, ease: "power2.out" }, tJoi);
      lab("#s3-l6", tJoi + 0.05, D - 0.8, just[0].t + 0.4);
      just.forEach(function (j) {
        clipEl.parentNode.insertBefore(document.querySelector(j.sel), clipEl);
        page(j.sel, j.t);
      });
      // trombone puis fermeture juste après « circuit » : la fiche reste lisible environ une seconde
      var tClip = L(C.at("L06", ["circuit"]) + 0.3);
      tl.to("#s3-clip", { y: 0, opacity: 1, duration: 0.25, ease: "power3.out" }, tClip);
      var tClose = tClip + 0.3;
      tl.to("#s3-inside", { scaleX: 0, duration: 0.22, ease: "power2.in" }, tClose)
        .set("#s3-cover", { autoAlpha: 1 }, tClose + 0.22)
        .to("#s3-cover", { scaleX: 1, duration: 0.26, ease: "power2.out" }, tClose + 0.22);
      // elle soulève le dossier : bascule de la caméra vers la rue (raccord avec le plan suivant)
      tl.to("#s3-folderR", { y: -140, scale: 1.04, transformOrigin: "1420px 540px", duration: 0.5, ease: "power2.inOut" }, D - 1.05);
      tl.to(["#s3-stage", "#s3-k2", "#s3-l6"], { y: P.V ? 2200 : 1080, duration: 0.6, ease: "power2.in" }, D - 0.6);
      if (P.V) {
        // vertical : le dossier ouvert occupe la bande utile, les libellés passent en titre
        var vw = P.vwrap("s3-stage", ["s3-k1", "s3-k2", "s3-l1", "s3-l2", "s3-l3", "s3-l4", "s3-l5", "s3-l6"]);
        ["s3-k1", "s3-k2"].forEach(function (k) {
          P.vkick(k);
        });
        ["s3-l1", "s3-l2", "s3-l3", "s3-l4", "s3-l5", "s3-l6"].forEach(function (k) {
          P.vtitle(k, 250, 88);
        });
        P.vbg("s3-stage", -500, "#F2F3EF", 2200);
        P.vset(vw, 960, 540, 0.95);
        P.vto(tl, vw, tOpen + 0.05, 0.9, 1220, 600, 1.0);
      }
      window.__timelines["s3"] = tl;
    })();
  </script>
</template>
