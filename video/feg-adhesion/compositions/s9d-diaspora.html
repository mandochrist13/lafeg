  <script>
    (function () {
      var C = window.__FEG_CUES;
      var P = window.FEGP;
      var G = window.__FEG_GLOBE;
      var L = C.local("s9d");
      var D = C.sc.s9d.dur;
      document.getElementById("s9d-fr").setAttribute("d", G.france);
      document.getElementById("s9d-ga").setAttribute("d", G.gabon);
      document.getElementById("s9d-pfr").setAttribute("d", G.france);
      document.getElementById("s9d-pga").setAttribute("d", G.gabon);
      var tl = gsap.timeline({ paused: true });

      // ---------------- A : le globe
      var arc = document.getElementById("s9d-arcrev");
      var arcLen = arc.getTotalLength();
      gsap.set("#s9d-arcrev", { strokeDasharray: arcLen + 20, strokeDashoffset: arcLen + 20 });
      gsap.set(["#s9d-paris", "#s9d-lbv", "#s9d-plane"], { scale: 0, transformOrigin: "50% 50%" });
      gsap.set(["#s9d-ringga"], { opacity: 0, scale: 0.6, transformOrigin: "50% 50%" });
      gsap.set(["#s9d-lead", "#s9d-lead2"], { opacity: 0 });
      gsap.set("#s9d-b", { opacity: 0 });
      tl.fromTo("#s9d-globe", { opacity: 0, scale: 0.94, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.8, ease: "expo.out" }, 0.1);
      tl.fromTo("#s9d-kickA", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, L(C.at("LD1", "Et")) + 0.05);
      // « au Gabon ? » : le Gabon s'allume, Libreville apparaît
      var tGab = L(C.at("LD1", "Gabon")) - 0.05;
      tl.to("#s9d-ga", { fill: "#0A7537", duration: 0.3, ease: "power2.out" }, tGab);
      tl.to("#s9d-ringga", { opacity: 1, scale: 1, duration: 0.25, ease: "power2.out" }, tGab).to("#s9d-ringga", { opacity: 0, scale: 1.9, duration: 0.6, ease: "power2.out" }, tGab + 0.25);
      tl.to("#s9d-lbv", { scale: 1, duration: 0.3, ease: "back.out(2)" }, tGab + 0.15);
      tl.fromTo("#s9d-llbv", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, tGab + 0.25);
      // « La Fédération s'ouvre aussi à la diaspora gabonaise »
      tl.fromTo("#s9d-titleA span", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.067, ease: "power4.out" }, L(C.at("LD1", "Fédération")) - 0.12);
      var tDia = L(C.at("LD1", "diaspora")) - 0.1;
      tl.to("#s9d-fr", { fill: "#9DB3A4", duration: 0.3, ease: "power2.out" }, tDia);
      tl.to("#s9d-paris", { scale: 1, duration: 0.3, ease: "back.out(2)" }, tDia);
      tl.fromTo("#s9d-lparis", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, tDia + 0.1);
      // le trajet Paris → Libreville se trace ; l'avion le suit
      var tArc = tDia + 0.25,
        dArc = 1.5;
      tl.to("#s9d-arcrev", { strokeDashoffset: 0, duration: dArc, ease: "power2.inOut" }, tArc);
      var A0 = [1305.4, 387.9],
        AC = [1143.6, 563.5],
        A2 = [1339.6, 699.9];
      var pl = { u: 0 };
      function placePlane() {
        var u = pl.u,
          iu = 1 - u;
        var x = iu * iu * A0[0] + 2 * iu * u * AC[0] + u * u * A2[0];
        var y = iu * iu * A0[1] + 2 * iu * u * AC[1] + u * u * A2[1];
        var dx = 2 * iu * (AC[0] - A0[0]) + 2 * u * (A2[0] - AC[0]);
        var dy = 2 * iu * (AC[1] - A0[1]) + 2 * u * (A2[1] - AC[1]);
        var ang = (Math.atan2(dy, dx) * 180) / Math.PI + 90;
        document.getElementById("s9d-plane").setAttribute("transform", "translate(" + x.toFixed(1) + "," + y.toFixed(1) + ") rotate(" + ang.toFixed(1) + ") scale(" + (Math.sin(Math.PI * Math.min(1, u * 1.02)) > 0.02 ? 1 : 0) + ")");
      }
      placePlane();
      tl.fromTo(pl, { u: 0 }, { u: 1, duration: dArc, ease: "power2.inOut", onUpdate: placePlane }, tArc);
      // LD2 : la carte de la diaspora, sur Paris
      var tEnt = L(C.at("LD2", "Entrepreneurs")) - 0.12;
      tl.fromTo("#s9d-card", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.6, ease: "expo.out" }, tEnt);
      tl.to("#s9d-lead", { opacity: 1, duration: 0.2, ease: "power2.out" }, tEnt + 0.2);
      gsap.set(["#s9d-c2", "#s9d-c3"], { display: "none" });
      var tEtr = L(C.at("LD2", "entreprises")) - 0.1;
      tl.set("#s9d-c2", { display: "block" }, tEtr).fromTo("#s9d-c2", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out", immediateRender: false }, tEtr);
      var tCap = L(C.at("LD2", "capitaux")) - 0.1;
      tl.set("#s9d-c3", { display: "flex" }, tCap).fromTo("#s9d-c3", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out", immediateRender: false }, tCap);
      // « rejoindre la Fédération » : la FEG à Libreville
      var tFed = L(C.at("LD2", "rejoindre")) - 0.1;
      tl.fromTo("#s9d-badge", { opacity: 0, scale: 0.6, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.8)" }, tFed);
      tl.to("#s9d-lead2", { opacity: 1, duration: 0.2, ease: "power2.out" }, tFed + 0.15);
      tl.fromTo("#s9d-lbv", { scale: 1 }, { scale: 1.35, duration: 0.18, ease: "power2.out", immediateRender: false }, tFed + 0.1).to("#s9d-lbv", { scale: 1, duration: 0.3, ease: "power2.inOut" }, tFed + 0.3);
      // « selon des modalités adaptées »
      tl.fromTo("#s9d-sub .m", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, L(C.at("LD2", "selon")) - 0.1);
      tl.fromTo("#s9d-sub .c", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, L(C.at("LD2", "modalités")) + 0.1);

      // ---------------- B : la table du comité Rayonnement à l'international
      var Y = 880,
        cut = 772 - Y;
      var ppl = [
        { id: "d0", x: 80, skin: "#5C3A24", hair: "short", top: "#C9CEC9", tie: "#3A4540", sex: "m" },
        { id: "d1", x: 300, skin: "#7F5236", hair: "bun", top: "#3A4540", sex: "f" },
        { id: "d2", x: 520, skin: "#4A2D1C", hair: "shaved", top: "#2F3A34", tie: "#AEB4AF", sex: "m", beard: true },
        { id: "d3", x: 740, skin: "#6E4429", hair: "locs", top: "#5C6660", sex: "f" },
        { id: "dh", x: 960, skin: "#6E4429", hair: "afro", top: "#0A7537", sex: "f" },
        { id: "d5", x: 1400, skin: "#4A2D1C", hair: "afro", top: "#2F3A34", sex: "f" },
        { id: "d6", x: 1620, skin: "#7F5236", hair: "grey", hairColor: "#BFC3BE", top: "#5C6660", tie: "#3A4540", sex: "m" },
        { id: "d7", x: 1840, skin: "#6E4429", hair: "bun", top: "#C9CEC9", sex: "f" },
      ];
      var html = ppl
        .map(function (p) {
          return P.front(p.id, { x: p.x, y: Y, s: 1, skin: p.skin, hair: p.hair, hairColor: p.hairColor, top: p.top, tie: p.tie, sex: p.sex, glasses: p.glasses, beard: p.beard, cut: cut, table: true });
        })
        .join("");
      // l'entrepreneur de la diaspora, qui prend la place libre
      html += P.front("dn", { x: 1180, y: Y, s: 1, skin: "#5C3A24", hair: "short", top: "#26344D", tie: "#AEAE7D", sex: "m", glasses: true, cut: cut, table: true });
      document.getElementById("s9d-people").innerHTML = html;
      ppl.concat([{ id: "dn" }]).forEach(function (p) {
        P.prep(p.id);
        gsap.set("#" + p.id + "-uaL", { rotation: 14 });
        gsap.set("#" + p.id + "-uaR", { rotation: -14 });
      });
      var tCut = L(C.lines.LD3.start) - 0.25;
      tl.set("#s9d-a", { opacity: 0 }, tCut).set("#s9d-b", { opacity: 1 }, tCut);
      tl.to(["#s9d-kickA", "#s9d-titleA", "#s9d-sub"], { opacity: 0, filter: "blur(8px)", duration: 0.22, ease: "power3.in" }, tCut - 0.22);
      tl.fromTo("#s9d-kickB", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, tCut + 0.1);
      // « participer » : il prend place ; elle et ses voisins se tournent vers lui
      var tSit = L(C.at("LD3", "participer")) - 0.3;
      gsap.set("#dn", { y: -46, opacity: 0 });
      tl.to("#dn", { opacity: 1, duration: 0.3, ease: "power2.out" }, tSit).to("#dn", { y: 0, duration: 0.6, ease: "power2.inOut" }, tSit);
      tl.to("#dh-head", { rotation: 7, duration: 0.45, ease: "power2.inOut" }, tSit + 0.4)
        .to("#d5-head", { rotation: -7, duration: 0.45, ease: "power2.inOut" }, tSit + 0.5)
        .to(["#dh-mouth", "#d5-mouth", "#dn-mouth"], { scaleX: 1.12, scaleY: 1.35, duration: 0.35, ease: "power2.out", stagger: 0.1 }, tSit + 0.55)
        .to("#dn-head", { rotation: -4, duration: 0.45, ease: "power2.inOut" }, tSit + 0.7)
        .to("#d3-head", { rotation: 4, duration: 0.5, ease: "power2.inOut" }, tSit + 0.8)
        .to("#d6-head", { rotation: -4, duration: 0.5, ease: "power2.inOut" }, tSit + 0.9);
      tl.fromTo("#s9d-poster", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, tCut + 0.2);
      // « le comité Rayonnement à l'international »
      tl.fromTo("#s9d-titleB span", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.12, ease: "power4.out" }, L(C.at("LD3", "Rayonnement")) - 0.1);
      var tWide = L(C.at("LD3", "international")) - 0.1;
      tl.to("#s9d-bcam", { scale: 0.88, transformOrigin: "1060px 860px", duration: 1.6, ease: "power2.inOut" }, tWide);
      ppl.concat([{ id: "dn" }]).forEach(function (p, i) {
        P.breathe(tl, p.id, tCut + 0.1 * i, D, 3.2 + 0.25 * (i % 4), 0.007);
      });
      P.blink(tl, "d1", [tSit + 1.2]);
      P.blink(tl, "dn", [tWide + 0.6]);
      P.blink(tl, "dh", [tSit + 1.9]);

      tl.set("#s9d-card", { opacity: 0 }, tCut);
      if (P.V) {
        // vertical : les textes en haut ; la carte de la diaspora sous le titre (hors du globe, pour rester lisible),
        // puis les modalités à sa place ; le globe dessous, au-dessus des sous-titres ; enfin la table du comité
        var vw = P.vwrap("s9d-a", ["s9d-kickA", "s9d-titleA", "s9d-sub", "s9d-kickB", "s9d-titleB", "s9d-card"]);
        P.vkick("s9d-kickA");
        P.vtitle("s9d-titleA", 250, 92);
        P.vtext("s9d-card", { left: "80px", top: "468px" });
        document.querySelectorAll("#s9d-card .l").forEach(function (e) {
          e.style.fontSize = "38px";
        });
        document.querySelector("#s9d-card .l3").style.fontSize = "36px";
        document.getElementById("s9d-lead").style.display = "none";
        tl.to("#s9d-card", { opacity: 0, duration: 0.25, ease: "power2.in" }, L(C.at("LD2", "selon")) - 0.38);
        P.vtext("s9d-sub", { left: "80px", top: "484px", width: "920px" });
        document.querySelector("#s9d-sub .m").style.fontSize = "44px";
        document.querySelector("#s9d-sub .c").style.fontSize = "38px";
        P.vkick("s9d-kickB");
        P.vtitle("s9d-titleB", 250, 92);
        // noms de villes agrandis (la caméra les réduit à 0,64)
        P.vtext("s9d-lparis", { fontSize: "46px", left: "1328px", top: "356px" });
        P.vtext("s9d-llbv", { fontSize: "46px", left: "1060px", top: "708px", width: "260px" });
        // la table du comité : le mur couvre le haut du cadre, le devant de table le bas (pas de bande blanche)
        var wall = document.getElementById("s9d-wall");
        wall.setAttribute("x", "-600");
        wall.setAttribute("width", "3120");
