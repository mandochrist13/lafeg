  <script>
    (function () {
      var C = window.__FEG_CUES;
      var P = window.FEGP;
      var M = window.__FEG_MAP;
      var L = C.local("s9d");
      var D = C.sc.s9d.dur;
      var V = P.V;
      // temps d'un mot pris tel quel (« info » ne doit pas tomber sur « information »)
      function W(id, n, which) {
        var ws = C.lines[id].words;
        for (var i = 0; i < ws.length; i++) if (ws[i].n === n) return ws[i][which || "s"];
        return C.at(id, n, which);
      }
      var tl = gsap.timeline({ paused: true });

      // ---------------- A : la carte du monde
      document.getElementById("s9d-land").setAttribute("d", M.land);
      var ORDER = ["ca", "us", "gb", "be", "fr", "ma", "sn", "ci", "za", "ae"];
      // libellés : décalage depuis la ville [dx, dy, 1 = à gauche du point (texte aligné à droite)]
      var LAB = { ca: [-30, -78, 0], us: [-20, 26, 0], gb: [-20, -48, 1], be: [20, -36, 0], fr: [22, 4, 0], ma: [-20, -20, 1], sn: [-20, -20, 1], ci: [-10, 18, 1], za: [22, -20, 0], ae: [-4, -54, 1] };
      var ctry = '<path id="s9d-k-ga" d="' + M.countries.ga.d + '" fill="#E3E7E1" />',
        masks = "",
        arcs = "",
        comets = "",
        dots = "",
        labs = "";
      ORDER.forEach(function (k) {
        var c = M.cities[k],
          o = LAB[k];
        ctry += '<path id="s9d-k-' + k + '" d="' + M.countries[k].d + '" fill="#E3E7E1" />';
        masks += '<mask id="s9d-m-' + k + '" maskUnits="userSpaceOnUse" x="-200" y="-200" width="2400" height="1500"><path id="s9d-mr-' + k + '" d="' + c.arc + '" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" /></mask>';
        arcs += '<path id="s9d-arc-' + k + '" d="' + c.arc + '" mask="url(#s9d-m-' + k + ')" />';
        comets += '<path id="s9d-co-' + k + '" d="' + c.arc + '" />';
        dots += '<g id="s9d-d-' + k + '" transform="translate(' + c.xy[0] + "," + c.xy[1] + ')"><circle r="8.5" fill="#063D21" stroke="#FFFFFF" stroke-width="3" /></g>';
        labs += '<div id="s9d-l-' + k + '" class="s9d-lab" style="left:' + (c.xy[0] + o[0]) + "px;top:" + (c.xy[1] + o[1]) + 'px">' + M.countries[k].label + "</div>";
      });
      document.getElementById("s9d-ctry").innerHTML = ctry;
      document.getElementById("s9d-masks").innerHTML = masks;
      document.getElementById("s9d-arcs").innerHTML = arcs;
      document.getElementById("s9d-comets").innerHTML = comets;
      document.getElementById("s9d-dots").innerHTML = dots;
      document.getElementById("s9d-labs").innerHTML = labs;
      var LBV = M.lbv;
      // centre du Gabon, un peu à l'est et au sud de Libreville ; la FEG à droite du pays, reliée à Libreville
      var GA = [LBV[0] + 17, LBV[1] + 12];
      document.getElementById("s9d-lbv").setAttribute("transform", "translate(" + LBV[0] + "," + LBV[1] + ")");
      document.getElementById("s9d-ringga").setAttribute("transform", "translate(" + GA[0] + "," + GA[1] + ")");
      var lead = document.getElementById("s9d-lead");
      lead.setAttribute("x1", LBV[0] + 8);
      lead.setAttribute("y1", LBV[1] + 5);
      lead.setAttribute("x2", LBV[0] + 70);
      lead.setAttribute("y2", LBV[1] + 18);
      gsap.set("#s9d-badge", { left: LBV[0] + 68, top: LBV[1] - 20 });
      // « Gabon » en bas à gauche de Libreville, sur l'océan
      gsap.set("#s9d-lga", { left: LBV[0] - 18, top: LBV[1] + 22, xPercent: -100 });
      ORDER.forEach(function (k) {
        if (LAB[k][2]) gsap.set("#s9d-l-" + k, { xPercent: -100 });
        var len = document.getElementById("s9d-mr-" + k).getTotalLength();
        // trait de révélation entièrement avant le début du trajet (pas de point rond visible au départ)
        gsap.set("#s9d-mr-" + k, { strokeDasharray: len + 20 + " " + (len + 40), strokeDashoffset: len + 40 });
      });
      gsap.set("#s9d-dots g, #s9d-lbv", { scale: 0, transformOrigin: "50% 50%" });
      gsap.set("#s9d-ringga", { opacity: 0, scale: 0.6, transformOrigin: "50% 50%" });
      gsap.set(["#s9d-lead", "#s9d-labs .s9d-lab", "#s9d-lga"], { opacity: 0 });
      gsap.set(["#s9d-b", "#s9d-c"], { opacity: 0 });

      tl.fromTo("#s9d-mapcam", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.05);
      tl.fromTo("#s9d-kickA", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, L(C.at("LD1", "Et")) + 0.05);
      // caméra : on part du Gabon (×2,2), on recule sur « Où que vous soyez dans le monde »
      var tZoom = L(C.at("LD1", "Où")) - 0.15;
      if (!V) {
        gsap.set("#s9d-mapcam", { x: 1290 - GA[0] * 2.2, y: 620 - GA[1] * 2.2, scale: 2.2, transformOrigin: "0px 0px", force3D: false });
        tl.to("#s9d-mapcam", { x: 1290 - GA[0] * 2.3, y: 620 - GA[1] * 2.3, scale: 2.3, duration: tZoom, ease: "none", force3D: false }, 0);
        tl.to("#s9d-mapcam", { x: 0, y: 0, scale: 1, duration: 1.5, ease: "power2.inOut", force3D: false }, tZoom);
      }
      // « au Gabon ? » : le Gabon s'allume
      var tGab = L(C.at("LD1", "Gabon")) - 0.1;
      tl.to("#s9d-k-ga", { fill: "#0A7537", duration: 0.3, ease: "power2.out" }, tGab);
      tl.to("#s9d-ringga", { opacity: 1, scale: 1, duration: 0.25, ease: "power2.out" }, tGab).to("#s9d-ringga", { opacity: 0, scale: 1.9, duration: 0.6, ease: "power2.out" }, tGab + 0.25);
      tl.to("#s9d-lbv", { scale: 1, duration: 0.3, ease: "back.out(2)" }, tGab + 0.15);
      tl.fromTo("#s9d-lga", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, tGab + 0.2);
      // « Où que vous soyez dans le monde » : pendant le recul, les pays de la diaspora se teintent ;
      // quand la carte se pose, leurs villes et leurs noms apparaissent un à un
      ORDER.forEach(function (k, i) {
        tl.to("#s9d-k-" + k, { fill: "#9DB3A4", duration: 0.3, ease: "power2.out" }, tZoom + 0.3 + 0.08 * i);
