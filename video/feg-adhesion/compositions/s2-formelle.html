  <script>
    (function () {
      var C = window.__FEG_CUES;
      var P = window.FEGP;
      var L = C.local("s2");
      var D = C.sc.s2.dur;
      document.getElementById("s2-cover").innerHTML = P.folderTop(300, 420);
      // la main droite et son tampon, vus de dessus (le tampon sous la main)
      var stamp =
        '<div style="position:absolute;left:-80px;top:-50px;width:160px;height:96px;border-radius:14px;background:#3A4540;box-shadow:0 6px 14px rgba(0,0,0,.18)">' +
        '<div style="position:absolute;left:10px;top:8px;right:10px;bottom:14px;border-radius:10px;background:#46524C"></div></div>' +
        '<div style="position:absolute;left:-30px;top:-30px;width:60px;height:60px;border-radius:50%;background:#2B3330"></div>';
      var R = -25; // inclinaison du bras (degrés)
      document.getElementById("s2-arms").innerHTML = P.armTop("s2a", { pose: "grip", hand: "R", s: 1, r: R, under: stamp });
      // position du coude pour que la main (prise à 0,-470 dans le repère du bras) tombe sur (tx, ty)
      var rad = (R * Math.PI) / 180;
      var gx = 470 * Math.sin(rad),
        gy = -470 * Math.cos(rad);
      function elbow(tx, ty) {
        return { x: tx - gx, y: ty - gy };
      }
      var tl = gsap.timeline({ paused: true });

      // raccord : on part de la couverture plein cadre (684 × 957, centrée), on recule
      gsap.set("#s2-cam", { transformOrigin: "1580px 320px", scale: 2.28, x: -620, y: 220 });
      tl.to("#s2-cam", { scale: 1, x: 0, y: 0, duration: 1.0, ease: "power2.out" }, 0);
      // la sangle et le cadenas se referment sur le dossier
      gsap.set("#s2-lockall", { x: 340, opacity: 0 });
      tl.to("#s2-lockall", { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, L(C.at("L02", ["D'abord", "abord"]) + 0.1));

      // titres
      tl.fromTo("#s2-kick", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, L(C.at("L02", ["condition"]) - 0.1));
      tl.fromTo("#s2-title span", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.067, ease: "power4.out" }, L(C.at("L02", ["être", "etre"]) - 0.1));

      // les cinq pièces : chacune arrive quand la voix la nomme, puis reçoit son tampon
      var docs = [
        { w: "#s2-w1", st: "#s2-st1", tin: C.at("L03", ["registre"]) - 0.55, hit: C.at("L03", ["commerce"]) + 0.15, x: 185, y: 610 },
        { w: "#s2-w2", st: "#s2-st2", tin: C.at("L03", ["numéro", "numero"]) - 0.2, hit: C.at("L03", ["fiscale"]) + 0.08, x: 505, y: 618 },
        { w: "#s2-w3", st: "#s2-st3", tin: C.at("L03", ["CNSS", "cnss"]) - 0.5, hit: C.at("L03", ["CNSS", "cnss"]) + 0.32, x: 825, y: 606 },
        { w: "#s2-w4", st: "#s2-st4", tin: C.at("L03", ["CNAMGS", "cnamgs", "knam"]) - 0.45, hit: C.at("L03", ["CNAMGS", "cnamgs", "knam"]) + 0.42, x: 1145, y: 616 },
        { w: "#s2-w5", st: "#s2-st5", tin: C.at("L03", ["impôts", "impots"]) - 0.5, hit: C.at("L03", ["impôts", "impots"]) + 0.3, x: 1465, y: 608 },
      ];
      var first = elbow(docs[0].x + 135, docs[0].y + 230);
      gsap.set("#s2a", { x: first.x + 520, y: first.y + 520 });
      gsap.set("#s2a-arm", { scale: 1.07, transformOrigin: "0px -470px" });
      docs.forEach(function (d, i) {
        var tin = L(d.tin),
          hit = L(d.hit);
        tl.fromTo(d.w, { y: P.V ? 1600 : 520, opacity: 1, rotation: i % 2 ? 6 : -6 }, { y: 0, rotation: 0, duration: 0.5, ease: "power3.out" }, tin);
        // la main se place au-dessus de la pièce
        var e = elbow(d.x + 140, d.y + 232);
        var tMove = Math.max(tin + 0.15, hit - 0.75);
        tl.to("#s2a", { x: e.x, y: e.y, duration: Math.min(0.55, hit - 0.12 - tMove), ease: "power2.inOut" }, tMove);
        // levée, frappe, l'encre apparaît au contact
        tl.to("#s2a-arm", { scale: 1.12, duration: 0.12, ease: "power2.out" }, hit - 0.18)
          .to("#s2a-arm", { scale: 1.0, duration: 0.06, ease: "power4.in" }, hit - 0.06)
          .set(d.st, { opacity: 0.92 }, hit)
          .to("#s2a-arm", { scale: 1.07, duration: 0.2, ease: "power2.out" }, hit + 0.05);
      });
      // la main repart ; le cadenas s'ouvre
      var tEnd = L(docs[4].hit) + 0.22;
      tl.to("#s2a", { x: "+=560", y: "+=520", duration: 0.5, ease: "power2.in" }, tEnd);
      tl.to("#s2-shackle", { y: -16, duration: 0.18, ease: "power2.out" }, tEnd + 0.05).to("#s2-lockall", { x: 360, opacity: 0, duration: 0.45, ease: "power2.in" }, tEnd + 0.3);
      // raccord vers l'étape 1 : on pousse vers le dossier ouvert (360 × 504, centré)
      tl.to(["#s2-kick", "#s2-title"], { opacity: 0, filter: "blur(8px)", duration: 0.22, ease: "power3.in" }, D - 0.85);
      tl.to(["#s2-w1", "#s2-w2", "#s2-w3", "#s2-w4", "#s2-w5"], { opacity: 0, duration: 0.3, ease: "power2.in" }, D - 0.7);
      tl.to("#s2-cam", { scale: 1.2, x: -620, y: 220, duration: 0.75, ease: "power2.inOut" }, D - 0.75);
      if (P.V) {
        // vertical : la caméra va du dossier verrouillé à chaque pièce tamponnée, puis revient au cadenas
        var vw = P.vwrap("s2-cam", ["s2-kick", "s2-title"]);
        // sous-titres des pièces : décor du document (la voix et les sous-titres disent la même chose)
        document.querySelectorAll("#s2-cam .s2-doc .ds").forEach(function (e) {
          e.setAttribute("data-layout-ignore", "");
        });
        P.vkick("s2-kick");
        P.vtitle("s2-title", 250, 92);
        P.vset(vw, 960, 540, 0.95);
        P.vto(tl, vw, 0.15, 1.0, 1580, 430, 1.0);
        // la rangée des pièces en plan plus large : le dossier reste sous le titre, les tampons au-dessus des sous-titres
        // deux premières pièces en plan serré (le dossier est hors champ), puis la rangée entière
        var cams = [
          [680, 740, 1.0],
          [680, 740, 1.0],
          [960, 680, 0.82],
          [1180, 680, 0.82],
          [1300, 680, 0.82],
        ];
        docs.forEach(function (d, i) {
          var c = cams[i];
          if (i === 0) P.vto(tl, vw, L(d.tin) - 0.55, 0.9, c[0], c[1], c[2]);
          else P.vto(tl, vw, L(d.tin) - 0.3, 0.6, c[0], c[1], c[2]);
        });
        P.vto(tl, vw, L(docs[4].hit) + 0.05, 0.45, 1560, 430, 1.0);
        P.vto(tl, vw, D - 0.75, 0.75, 960, 540, 0.95);
      }
      window.__timelines["s2"] = tl;
    })();
  </script>
