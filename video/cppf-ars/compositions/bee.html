<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: transparent;
    }
    #bee-box {
      position: absolute;
      left: 0;
      top: 0;
      width: 640px;
      height: 800px;
      transform-origin: 0 0;
      filter: drop-shadow(0 14px 22px rgba(28, 43, 74, 0.16));
    }
  </style>
  <div id="root" data-composition-id="bee" data-width="1920" data-height="1080" data-layout-allow-overflow data-layout-allow-overlap>
    <div id="bee-box"></div>
  </div>
  <script>
    (function () {
      var C = window.__CPPF_CUES;
      var B = window.BEE;
      var TALK = window.__CPPF_TALK;
      var L = C.local("bee");
      var D = C.sc.bee.dur;
      var at = function (id, w) {
        return L(C.at(id, w));
      };
      document.getElementById("bee-box").innerHTML = B.svg("abeille", { w: 640 });
      B.prep("abeille");

      // poses en buste, coupées par le bas de l'image comme un présentateur :
      // coin haut-gauche de la boîte 640 × 800 et échelle
      var POSE = {
        hello: { x: 176, y: 128, scale: 1.2 },
        step: { x: 70, y: 540, scale: 0.7 },
        end: { x: 176, y: 128, scale: 1.2 },
      };
      var tl = gsap.timeline({ paused: true });
      // entrée : elle monte dans le cadre, ailes frémissantes
      gsap.set("#bee-box", { x: POSE.hello.x, y: POSE.hello.y + 760, scale: POSE.hello.scale * 0.96 });
      tl.to("#bee-box", { y: POSE.hello.y, scale: POSE.hello.scale, duration: 1.1, ease: "power3.out" }, 0);
      // vers les écrans (étapes), puis la fin
      var tStep = L(C.sc.c3.start) - 0.1;
      var tEnd = L(C.sc.c8.start) - 0.1;
      tl.to("#bee-box", { x: POSE.step.x, y: POSE.step.y, scale: POSE.step.scale, duration: 0.95, ease: "power2.inOut" }, tStep);
      tl.to("#bee-box", { x: POSE.end.x, y: POSE.end.y, scale: POSE.end.scale, duration: 1.0, ease: "power2.inOut" }, tEnd);

      // vie : respiration, ailes, antennes, clignements
      B.hover(tl, "abeille", 0, D, 3, 3.4);
      B.flap(tl, "abeille", 0, D);
      B.antennae(tl, "abeille", 0, D);
      var blinks = [];
      for (var t = 2.2; t < D - 0.5; t += 3.1 + ((Math.round(t * 10) % 7) / 10)) blinks.push(t);
      B.blink(tl, "abeille", blinks);

      // parole : la bouche suit la voix
      C.order.forEach(function (id) {
        B.talk(tl, "abeille", L(C.lines[id].start), TALK[id]);
      });

      // gestes calés sur la voix (posés, sans rebond)
      B.wave(tl, "abeille", at("L01", "Bonjour") - 0.15, 2);
      B.brows(tl, "abeille", at("L01", "Bienvenue"), -4, 0.7);
      B.tilt(tl, "abeille", at("L01", "Bienvenue"), 4, 0.4);
      B.tilt(tl, "abeille", at("L01", "service"), 0, 0.5);
      B.open(tl, "abeille", at("L02", "Aujourd"), 1.5);
      B.point(tl, "abeille", at("L02", "certificat"), 100, 2.2);
      B.nod(tl, "abeille", at("L02", "Rentree"));
      // étapes : elle regarde l'écran et le montre
      B.look(tl, "abeille", tStep + 0.4, 5, 1);
      B.point(tl, "abeille", at("L03", "Rendez"), 100, 1.8);
      B.point(tl, "abeille", at("L03", "Saisissez"), 100, 2.6);
      B.point(tl, "abeille", at("L04", "cocher"), 96, 1.3);
      B.nod(tl, "abeille", at("L04", "connecter"));
      B.point(tl, "abeille", at("L05", "liste"), 100, 1.4);
      B.point(tl, "abeille", at("L05", "Traiter") - 0.2, 100, 1.3);
      B.point(tl, "abeille", at("L06", "Remplissez"), 100, 1.6);
      B.point(tl, "abeille", at("L06", "etablissement"), 96, 1.3);
      B.nod(tl, "abeille", at("L07", "Verifiez"));
      B.tilt(tl, "abeille", at("L07", "Verifiez") + 0.5, -4, 0.4);
      B.tilt(tl, "abeille", at("L07", "jaune") + 0.6, 0, 0.5);
      B.point(tl, "abeille", at("L07", "jaune") - 0.2, 100, 1.6);
      B.point(tl, "abeille", at("L08", "Exporter") - 0.2, 100, 1.3);
      B.nod(tl, "abeille", at("L08", "automatiquement"));
      B.open(tl, "abeille", at("L09", "Imprimez"), 1.1);
      B.point(tl, "abeille", at("L09", "signer"), 96, 1.3);
      B.point(tl, "abeille", at("L10", "scannez"), 96, 1.0);
      B.point(tl, "abeille", at("L11", "Choisir") - 0.2, 100, 1.3);
      B.nod(tl, "abeille", at("L11", "validez"));
      B.open(tl, "abeille", at("L12", "Repetez"), 1.1);
      B.nod(tl, "abeille", at("L12", "lisible"));
      B.look(tl, "abeille", tEnd + 0.3, 0, 0);
      // fin : bras ouverts, puis un salut
      B.open(tl, "abeille", at("L13", "Avec"), 2.8);
      B.tilt(tl, "abeille", at("L13", "simplicite"), 4, 0.4);
      B.tilt(tl, "abeille", at("L13", "Solidaires"), 0, 0.4);
      B.wave(tl, "abeille", at("L13", "Solidaires"), 2);
      window.__timelines["bee"] = tl;
    })();
  </script>
</template>
