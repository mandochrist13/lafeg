<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: transparent;
    }
    #bee-box {
      position: absolute;
      left: 0;
      top: 0;
      width: 560px;
      height: 672px;
      transform-origin: 0 0;
      filter: drop-shadow(0 18px 24px rgba(28, 43, 74, 0.16));
    }
  </style>
  <div id="root" data-composition-id="bee" data-width="1920" data-height="1080" data-layout-allow-overflow data-layout-allow-overlap>
    <div id="bee-box"></div>
  </div>
  <script>
    (function () {
      var C = window.__CPPF_CUES;
      var B = window.BEE;
      var TALK = window.__CPPF_TALK;
      var L = C.local("bee");
      var D = C.sc.bee.dur;
      var at = function (id, w) {
        return L(C.at(id, w));
      };
      document.getElementById("bee-box").innerHTML = B.svg("abeille", { w: 560 });
      B.prep("abeille");

      // poses : position du coin haut-gauche et échelle (560 × 672 à l'échelle 1)
      var POSE = {
        hello: { x: 230, y: 196, scale: 1.0 },
        step: { x: 86, y: 612, scale: 0.58 },
        end: { x: 250, y: 214, scale: 0.92 },
      };
      var tl = gsap.timeline({ paused: true });
      // entrée : elle arrive en volant par la droite
      gsap.set("#bee-box", { x: 2050, y: 60, scale: 0.6, rotation: -8 });
      tl.to("#bee-box", { x: POSE.hello.x, y: POSE.hello.y, scale: POSE.hello.scale, rotation: 0, duration: 1.05, ease: "power3.out" }, 0);
      tl.fromTo("#abeille-all", { rotation: -10, svgOrigin: "300 420" }, { rotation: 0, duration: 1.0, ease: "back.out(1.4)" }, 0.1);
      // vers les écrans (étapes), puis la fin
      var tStep = L(C.sc.c3.start) - 0.1;
      var tEnd = L(C.sc.c8.start) - 0.1;
      tl.to("#bee-box", { x: POSE.step.x, y: POSE.step.y, scale: POSE.step.scale, duration: 0.95, ease: "power2.inOut" }, tStep);
      tl.to("#bee-box", { x: POSE.end.x, y: POSE.end.y, scale: POSE.end.scale, duration: 1.0, ease: "power2.inOut" }, tEnd);

      // vie : vol stationnaire, ailes, antennes, clignements
      B.hover(tl, "abeille", 0, D, 11, 1.7);
      B.flap(tl, "abeille", 0, D);
      B.antennae(tl, "abeille", 0, D);
      var blinks = [];
      for (var t = 2.2; t < D - 0.5; t += 3.1 + ((Math.round(t * 10) % 7) / 10)) blinks.push(t);
      B.blink(tl, "abeille", blinks);

      // parole : la bouche suit la voix
      C.order.forEach(function (id) {
        B.talk(tl, "abeille", L(C.lines[id].start), TALK[id]);
      });

      // gestes calés sur la voix
      B.wave(tl, "abeille", at("L01", "Bonjour") - 0.1, 3);
      B.tilt(tl, "abeille", at("L01", "Bienvenue"), 6, 0.4);
      B.tilt(tl, "abeille", at("L01", "service"), 0, 0.5);
      B.open(tl, "abeille", at("L02", "Aujourd"), 1.5);
      B.point(tl, "abeille", at("L02", "certificat"), 100, 2.2);
      B.nod(tl, "abeille", at("L02", "Rentree"));
      // étapes : elle regarde l'écran et le montre
      B.look(tl, "abeille", tStep + 0.4, 7, 1);
      B.point(tl, "abeille", at("L03", "Rendez"), 104, 1.8);
      B.point(tl, "abeille", at("L03", "Saisissez"), 104, 2.6);
      B.point(tl, "abeille", at("L04", "cocher"), 98, 1.3);
      B.nod(tl, "abeille", at("L04", "connecter"));
      B.point(tl, "abeille", at("L05", "liste"), 102, 1.4);
      B.point(tl, "abeille", at("L05", "Traiter") - 0.2, 104, 1.3);
      B.point(tl, "abeille", at("L06", "Remplissez"), 102, 1.6);
      B.point(tl, "abeille", at("L06", "etablissement"), 98, 1.3);
      B.nod(tl, "abeille", at("L07", "Verifiez"));
      B.tilt(tl, "abeille", at("L07", "Verifiez") + 0.5, -6, 0.4);
      B.tilt(tl, "abeille", at("L07", "jaune") + 0.6, 0, 0.5);
      B.point(tl, "abeille", at("L07", "jaune") - 0.2, 104, 1.6);
      B.point(tl, "abeille", at("L08", "Exporter") - 0.2, 104, 1.3);
      B.nod(tl, "abeille", at("L08", "automatiquement"));
      B.open(tl, "abeille", at("L09", "Imprimez"), 1.1);
      B.point(tl, "abeille", at("L09", "signer"), 100, 1.3);
      B.point(tl, "abeille", at("L10", "scannez"), 100, 1.0);
      B.point(tl, "abeille", at("L11", "Choisir") - 0.2, 104, 1.3);
      B.nod(tl, "abeille", at("L11", "validez"));
      B.open(tl, "abeille", at("L12", "Repetez"), 1.1);
      B.nod(tl, "abeille", at("L12", "lisible"));
      B.look(tl, "abeille", tEnd + 0.3, 0, 0);
      // fin : bras ouverts, puis un salut
      B.open(tl, "abeille", at("L13", "Avec"), 2.8);
      B.tilt(tl, "abeille", at("L13", "simplicite"), 5, 0.4);
      B.tilt(tl, "abeille", at("L13", "Solidaires"), 0, 0.4);
      B.wave(tl, "abeille", at("L13", "Solidaires"), 3);
      window.__timelines["bee"] = tl;
    })();
  </script>
</template>
