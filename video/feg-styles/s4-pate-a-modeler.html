<!doctype html>
<!-- Aperçu 4 — pâte à modeler : miniature 3D aux formes rondes, lumière chaude, flou de profondeur. -->
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Aperçu — pâte à modeler</title>
    <link rel="stylesheet" href="fonts.css" />
    <script src="geo.js"></script>
    <style>
      body {
        background: #f0dcc0;
      }
      #gl {
        display: none;
      }
      #out,
      #ui {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
      }
      .title {
        position: absolute;
        left: 110px;
        top: 92px;
        font-family: "Hyundai Sans Head", sans-serif;
        font-weight: 700;
        font-size: 74px;
        line-height: 1.08;
        color: #13693c;
        letter-spacing: -0.01em;
        text-shadow:
          0 1px 0 #0f5c34,
          0 2px 0 #0d532f,
          0 3px 0 #0b4a2a,
          0 4px 0 #0a4326,
          0 5px 0 #093c22,
          0 6px 0 #08361f,
          0 16px 22px rgba(90, 50, 20, 0.32);
      }
      .title small {
        display: block;
        margin-top: 12px;
        font-weight: 500;
        font-size: 46px;
        color: #8a4a1e;
        text-shadow:
          0 1px 0 #7a4019,
          0 2px 0 #6c3815,
          0 3px 0 #5f3112,
          0 10px 16px rgba(90, 50, 20, 0.28);
      }
      #tag {
        position: absolute;
        right: 90px;
        bottom: 70px;
        width: 150px;
        height: 139px;
        padding: 14px;
        background: #fffaf1;
        border-radius: 26px;
        box-shadow:
          0 5px 0 #e0c9a6,
          0 16px 26px rgba(90, 50, 20, 0.3);
      }
      #tag img {
        width: 150px;
        height: 139px;
      }
    </style>
  </head>
  <body>
    <canvas id="gl"></canvas>
    <canvas id="out" width="3840" height="2160"></canvas>
    <div id="ui">
      <div class="title">Un atelier, un commerce,<br />un chantier…<small>qui font vivre le pays</small></div>
      <div id="tag"><img src="assets/img/feg-logo.png" alt="FEG" /></div>
    </div>
    <script type="module">
      import * as THREE from "./lib/three.module.js";
      function mulberry32(a) {
        return function () {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          let r = Math.imul(a ^ (a >>> 15), 1 | a);
          r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
          return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
        };
      }
      const rnd = mulberry32(71);
      const W = 1920,
        H = 1080,
        PR = 2;
      const canvas = document.getElementById("gl");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(PR);
      renderer.setSize(W, H, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xf0d9ba);
      scene.fog = new THREE.Fog(0xf0d9ba, 26, 62);
      const camera = new THREE.PerspectiveCamera(30, W / H, 0.5, 200);
      camera.position.set(1.2, 10.5, 21);
      camera.lookAt(0.6, 0.6, 1.2);

      // texture de « doigts » : bruit doux pour le relief de la pâte
      function clayBump() {
        const c = document.createElement("canvas");
        c.width = c.height = 512;
        const x = c.getContext("2d");
        x.fillStyle = "#808080";
        x.fillRect(0, 0, 512, 512);
        for (let k = 0; k < 2600; k++) {
          const px = rnd() * 512,
            py = rnd() * 512,
            r = 3 + rnd() * 16,
            v = 100 + rnd() * 56;
          const g = x.createRadialGradient(px, py, 0, px, py, r);
          g.addColorStop(0, `rgba(${v},${v},${v},0.35)`);
          g.addColorStop(1, `rgba(${v},${v},${v},0)`);
          x.fillStyle = g;
          x.beginPath();
          x.arc(px, py, r, 0, Math.PI * 2);
          x.fill();
        }
        const t = new THREE.CanvasTexture(c);
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        return t;
      }
      const BUMP = clayBump();
      const clay = (hex, rep = 1) => {
        const b = BUMP.clone();
        b.needsUpdate = true;
        b.repeat.set(rep, rep);
        return new THREE.MeshStandardMaterial({ color: hex, roughness: 0.82, metalness: 0, bumpMap: b, bumpScale: 0.9 });
      };
      // forme « faite à la main » : on bosselle légèrement les sommets
      function lumpy(geo, amp = 0.03, f = 3.1, seed = rnd() * 10) {
        const p = geo.attributes.position;
        const v = new THREE.Vector3();
        for (let i = 0; i < p.count; i++) {
          v.fromBufferAttribute(p, i);
          const n = Math.sin(v.x * f + seed) * Math.sin(v.y * f * 1.3 + seed * 1.7) * Math.sin(v.z * f * 0.9 + seed * 0.6);
          v.multiplyScalar(1 + amp * n);
          p.setXYZ(i, v.x, v.y, v.z);
        }
        geo.computeVertexNormals();
        return geo;
      }
      const add = (geo, mat, x, y, z, parent = scene) => {
        const m = new THREE.Mesh(geo, mat);
        m.position.set(x, y, z);
        m.castShadow = true;
        m.receiveShadow = true;
        parent.add(m);
        return m;
      };

      // lumières : soleil chaud, ciel doux, contre-jour
      scene.add(new THREE.HemisphereLight(0xfff3e0, 0xc89a6a, 0.95));
      const sun = new THREE.DirectionalLight(0xffe2bd, 2.6);
      sun.position.set(-9, 16, 10);
      sun.castShadow = true;
      sun.shadow.mapSize.set(4096, 4096);
      sun.shadow.camera.left = -18;
      sun.shadow.camera.right = 18;
      sun.shadow.camera.top = 18;
      sun.shadow.camera.bottom = -18;
      sun.shadow.bias = -0.0004;
      sun.shadow.radius = 5;
      scene.add(sun);
      const rim = new THREE.DirectionalLight(0xcfe4ff, 0.7);
      rim.position.set(8, 6, -12);
      scene.add(rim);

      // sol en pâte sable
      {
        const g = new THREE.PlaneGeometry(90, 90, 180, 180);
        g.rotateX(-Math.PI / 2);
        const p = g.attributes.position;
        for (let i = 0; i < p.count; i++) {
          const x = p.getX(i),
            z = p.getZ(i);
          p.setY(i, 0.06 * Math.sin(x * 0.9) * Math.cos(z * 0.7) + 0.04 * Math.sin(x * 2.3 + z * 1.7));
        }
        g.computeVertexNormals();
        const m = new THREE.Mesh(g, clay(0xe7c9a0, 10));
        m.receiveShadow = true;
        scene.add(m);
      }

      // le Gabon : 71 coussins de pâte verte (la trame du logo FEG)
      const GREENS = [0x2f8c55, 0x3a9b5f, 0x2a7d4b, 0x48a86a, 0x349457];
      const SCALE = 0.042,
        MZ = -4.2;
      const cushions = [];
      for (const [px, py] of window.FEG_DOTS) {
        const g = lumpy(new THREE.SphereGeometry(0.66, 28, 18), 0.05);
        g.scale(1, 0.46, 1);
        const m = add(g, clay(GREENS[Math.floor(rnd() * GREENS.length)], 0.6), (px - 342) * SCALE, 0.2, (py - 218) * SCALE + MZ);
        m.rotation.y = rnd() * Math.PI;
        cushions.push(m);
      }
      // quelques maisons et arbres posés sur la carte
      function house(x, z, wall, roof, s = 1) {
        const g = new THREE.Group();
        g.position.set(x, 0.4, z);
        g.scale.setScalar(s);
        add(lumpy(new THREE.BoxGeometry(0.9, 0.7, 0.8, 6, 6, 6), 0.03), clay(wall), 0, 0.35, 0, g);
        const r = lumpy(new THREE.ConeGeometry(0.78, 0.6, 4, 2), 0.04);
        r.rotateY(Math.PI / 4);
        add(r, clay(roof), 0, 1.0, 0, g);
        add(new THREE.BoxGeometry(0.22, 0.34, 0.05), clay(0x7a4a2a), 0, 0.17, 0.41, g);
        g.rotation.y = rnd() * 0.8 - 0.4;
        scene.add(g);
      }
      function tree(x, z, s = 1) {
        const g = new THREE.Group();
        g.position.set(x, 0.35, z);
        g.scale.setScalar(s);
        add(lumpy(new THREE.CylinderGeometry(0.11, 0.15, 0.8, 10), 0.05), clay(0x8a5a33), 0, 0.4, 0, g);
        add(lumpy(new THREE.SphereGeometry(0.55, 20, 14), 0.08), clay(0x1f6e3e), 0, 1.05, 0, g);
        add(lumpy(new THREE.SphereGeometry(0.38, 18, 12), 0.08), clay(0x2a8048), 0.3, 1.35, 0.1, g);
        scene.add(g);
      }
      house(-6.0, -3.2 + MZ * 0, 0xf2e6d0, 0xc4572e);
      house(2.8, -7.8, 0xf5ecd8, 0xd07a2a, 0.9);
      house(6.4, -2.4, 0xefe0c4, 0xb84a2a, 0.85);
      tree(-2.6, -7.4, 1.0);
      tree(4.4, 0.4, 0.9);
      tree(-5.0, 0.2, 0.8);

      // personnages en pâte à modeler
      function person({ x, z, rot = 0, skin, shirt, s = 1 }) {
        const g = new THREE.Group();
        g.position.set(x, 0, z);
        g.rotation.y = rot;
        g.scale.setScalar(s);
        add(lumpy(new THREE.CapsuleGeometry(0.52, 0.8, 10, 20), 0.025), clay(shirt), 0, 0.98, 0, g);
        const head = add(lumpy(new THREE.SphereGeometry(0.5, 32, 22), 0.02), clay(skin), 0, 2.2, 0.02, g);
        // yeux, reflets, sourire
        for (const sx of [-0.17, 0.17]) {
          add(new THREE.SphereGeometry(0.075, 16, 12), new THREE.MeshStandardMaterial({ color: 0x1a1410, roughness: 0.35 }), sx, 2.27, 0.46, g);
          add(new THREE.SphereGeometry(0.024, 10, 8), new THREE.MeshBasicMaterial({ color: 0xffffff }), sx + 0.025, 2.3, 0.53, g);
        }
        const smile = add(new THREE.TorusGeometry(0.13, 0.026, 10, 24, Math.PI), clay(0x3a1e14), 0, 2.08, 0.46, g);
        smile.rotation.z = Math.PI;
        // bras
        const arm = (sx, ang) => {
          const a = add(lumpy(new THREE.CapsuleGeometry(0.13, 0.55, 8, 12), 0.03), clay(shirt), sx, 1.2, 0.05, g);
          a.rotation.z = ang;
          return a;
        };
        return { g, head, arm };
      }
      // l'artisan (atelier) et son marteau
      {
        const p = person({ x: -4.2, z: 6.3, rot: 0.35, skin: 0x7a4a30, shirt: 0xd8782e });
        p.arm(-0.6, 0.5);
        const a = p.arm(0.62, -1.9);
        a.position.y = 1.55;
        const hm = new THREE.Group();
        hm.position.set(1.05, 1.95, 0.25);
        hm.rotation.z = -0.5;
        add(lumpy(new THREE.CylinderGeometry(0.06, 0.07, 0.9, 10), 0.04), clay(0xa36f3d), 0, 0, 0, hm);
        add(lumpy(new THREE.CapsuleGeometry(0.13, 0.34, 6, 12), 0.03), clay(0x80858c), 0, 0.48, 0, hm).rotation.z = Math.PI / 2;
        p.g.add(hm);
        add(lumpy(new THREE.CapsuleGeometry(0.4, 0.5, 8, 16), 0.02), clay(0x8b5a2b), 0, 0.85, 0.2, p.g).scale.set(1, 1, 0.5);
        scene.add(p.g);
      }
      // la commerçante et sa cagette de fruits
      {
        const p = person({ x: 0.4, z: 7.0, rot: -0.05, skin: 0x5c3522, shirt: 0x2f8f5b });
        // foulard
        add(lumpy(new THREE.TorusGeometry(0.42, 0.14, 12, 28), 0.04), clay(0xe9a93a), 0, 2.55, 0, p.g).rotation.x = Math.PI / 2;
        add(lumpy(new THREE.SphereGeometry(0.34, 20, 14), 0.06), clay(0xe9a93a), 0.05, 2.78, -0.05, p.g);
        p.arm(-0.58, 0.9).position.y = 1.35;
        p.arm(0.58, -0.9).position.y = 1.35;
        const crate = new THREE.Group();
        crate.position.set(0, 1.05, 0.78);
        add(lumpy(new THREE.BoxGeometry(1.35, 0.5, 0.7, 8, 4, 4), 0.025), clay(0xc58e52), 0, 0, 0, crate);
        const FR = [0xd8432b, 0xf0a020, 0xe2c23a, 0xd8432b, 0x6fae3c, 0xf0a020];
        for (let i = 0; i < 9; i++) add(lumpy(new THREE.SphereGeometry(0.17, 14, 10), 0.06), clay(FR[i % FR.length]), -0.45 + (i % 5) * 0.23 + (i > 4 ? 0.11 : 0), 0.34 + (i > 4 ? 0.12 : 0), -0.12 + (i > 4 ? 0.14 : 0), crate);
        p.g.add(crate);
        scene.add(p.g);
      }
      // le bâtisseur (chantier), casque et brique
      {
        const p = person({ x: 4.9, z: 6.1, rot: -0.4, skin: 0x8a5634, shirt: 0x2f5fa8 });
        add(lumpy(new THREE.SphereGeometry(0.55, 28, 14, 0, Math.PI * 2, 0, Math.PI / 2), 0.02), clay(0xf2c230), 0, 2.42, 0, p.g);
        add(new THREE.CylinderGeometry(0.66, 0.66, 0.07, 32), clay(0xf2c230), 0, 2.42, 0.05, p.g);
        p.arm(-0.6, 0.45);
        const a = p.arm(0.58, -1.1);
        a.position.y = 1.3;
        add(lumpy(new THREE.BoxGeometry(0.62, 0.3, 0.32, 4, 3, 3), 0.04), clay(0xb4532a), 0.98, 1.62, 0.25, p.g).rotation.z = -0.25;
        scene.add(p.g);
      }

      renderer.render(scene, camera);

      // flou de profondeur (miniature) : haut et bas flous, bande nette au milieu
      const out = document.getElementById("out").getContext("2d");
      out.drawImage(canvas, 0, 0);
      const off = document.createElement("canvas");
      off.width = 3840;
      off.height = 2160;
      const o = off.getContext("2d");
      o.filter = "blur(14px)";
      o.drawImage(canvas, 0, 0);
      o.filter = "none";
      o.globalCompositeOperation = "destination-in";
      const gm = o.createLinearGradient(0, 0, 0, 2160);
      gm.addColorStop(0, "rgba(0,0,0,1)");
      gm.addColorStop(0.3, "rgba(0,0,0,0.85)");
      gm.addColorStop(0.5, "rgba(0,0,0,0)");
      gm.addColorStop(0.8, "rgba(0,0,0,0)");
      gm.addColorStop(1, "rgba(0,0,0,0.9)");
      o.fillStyle = gm;
      o.fillRect(0, 0, 3840, 2160);
      out.drawImage(off, 0, 0);
      // vignette chaude
      const vg = out.createRadialGradient(1920, 1080, 600, 1920, 1080, 2300);
      vg.addColorStop(0, "rgba(120,60,20,0)");
      vg.addColorStop(1, "rgba(120,60,20,0.28)");
      out.fillStyle = vg;
      out.fillRect(0, 0, 3840, 2160);
      await document.fonts.ready;
      window.__ready = true;
    </script>
  </body>
</html>
