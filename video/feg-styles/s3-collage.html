<!doctype html>
<!-- Aperçu 3 — collage photo : papiers déchirés, photos scotchées, tampons et annotations au feutre. -->
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Aperçu — collage photo</title>
    <link rel="stylesheet" href="fonts.css" />
    <script src="geo.js"></script>
    <style>
      body {
        background: #ece2cc;
      }
      canvas {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
      }
    </style>
  </head>
  <body>
    <canvas id="c" width="3840" height="2160"></canvas>
    <script>
      function mulberry32(a) {
        return function () {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          let r = Math.imul(a ^ (a >>> 15), 1 | a);
          r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
          return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
        };
      }
      const rnd = mulberry32(1959);
      const GREEN = "#0b5a33",
        DEEP = "#063d21",
        BRONZE = "#b3ae78",
        INK = "#1d2a22";
      const load = (src) =>
        new Promise((res) => {
          const i = new Image();
          i.onload = () => res(i);
          i.src = src;
        });
      const cv = document.getElementById("c");
      const c = cv.getContext("2d");
      c.scale(2, 2);

      // bord déchiré : on suit un polygone en ajoutant de petites dents irrégulières
      function tornPath(pts, amp = 3.2, step = 5) {
        const out = [];
        for (let i = 0; i < pts.length; i++) {
          const [x0, y0] = pts[i],
            [x1, y1] = pts[(i + 1) % pts.length];
          const L = Math.hypot(x1 - x0, y1 - y0),
            n = Math.max(1, Math.floor(L / step));
          const nx = -(y1 - y0) / L,
            ny = (x1 - x0) / L;
          for (let k = 0; k < n; k++) {
            const u = k / n,
              j = (rnd() - 0.5) * 2 * amp + Math.sin(u * 9 + i) * amp * 0.4;
            out.push([x0 + (x1 - x0) * u + nx * j, y0 + (y1 - y0) * u + ny * j]);
          }
        }
        return out;
      }
      const rectPts = (w, h) => [
        [-w / 2, -h / 2],
        [w / 2, -h / 2],
        [w / 2, h / 2],
        [-w / 2, h / 2],
      ];
      function pathFrom(pts) {
        c.beginPath();
        pts.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y)));
        c.closePath();
      }
      function shadow(on, blur = 18, dy = 8, a = 0.28) {
        c.shadowColor = on ? `rgba(40,30,10,${a})` : "transparent";
        c.shadowBlur = on ? blur : 0;
        c.shadowOffsetY = on ? dy : 0;
        c.shadowOffsetX = on ? 3 : 0;
      }
      function grain(x, y, w, h, amt = 14, alpha = 0.07) {
        for (let k = 0; k < (w * h) / 60; k++) {
          c.fillStyle = rnd() < 0.5 ? `rgba(255,255,255,${alpha})` : `rgba(60,40,10,${alpha})`;
          c.fillRect(x + rnd() * w, y + rnd() * h, 1 + rnd() * 1.5, 1 + rnd() * 1.5);
        }
      }
      // ruban adhésif
      function tape(x, y, w, h, rot) {
        c.save();
        c.translate(x, y);
        c.rotate(rot);
        shadow(true, 6, 2, 0.12);
        c.fillStyle = "rgba(236, 226, 196, 0.78)";
        pathFrom(tornPath(rectPts(w, h), 1.6, 4));
        c.fill();
        shadow(false);
        c.restore();
      }
      // photo découpée : papier blanc déchiré, puis la photo
      function photo(img, x, y, w, h, rot, opts = {}) {
        const border = opts.border ?? 12,
          bottom = opts.bottom ?? border;
        c.save();
        c.translate(x, y);
        c.rotate(rot);
        const fw = w + 2 * border,
          fh = h + border + bottom;
        shadow(true, 22, 10, 0.3);
        c.fillStyle = "#fbf8f0";
        const paper = opts.clean ? rectPts(fw, fh) : tornPath(rectPts(fw, fh), 2.6, 5);
        c.translate(0, (bottom - border) / 2);
        pathFrom(paper);
        c.fill();
        shadow(false);
        c.translate(0, -(bottom - border) / 2);
        c.save();
        pathFrom(opts.clean ? rectPts(w, h) : tornPath(rectPts(w, h), 1.4, 6));
        c.clip();
        // recadrage centré (cover)
        const ar = img.width / img.height,
          tr = w / h;
        let sw = img.width,
          sh = img.height,
          sx = 0,
          sy = 0;
        if (ar > tr) {
          sw = img.height * tr;
          sx = (img.width - sw) * (opts.fx ?? 0.5);
        } else {
          sh = img.width / tr;
          sy = (img.height - sh) * (opts.fy ?? 0.5);
        }
        c.drawImage(img, sx, sy, sw, sh, -w / 2, -h / 2 - (bottom - border) / 2 + (bottom - border) / 2, w, h);
        // léger ton papier imprimé
        c.fillStyle = "rgba(240, 225, 190, 0.12)";
        c.fillRect(-w / 2, -h / 2, w, h);
        c.restore();
        if (opts.caption) {
          c.fillStyle = INK;
          c.font = "600 34px Caveat";
          c.textAlign = "center";
          c.fillText(opts.caption, 0, h / 2 + bottom * 0.62);
        }
        c.restore();
      }
      // bande de papier avec texte (titre en papiers collés)
      function strip(text, x, y, rot, size, bg, fg, padX = 26, padY = 14) {
        c.save();
        c.font = `700 ${size}px "Hyundai Sans Head"`;
        const w = c.measureText(text).width + 2 * padX,
          h = size * 1.08 + 2 * padY;
        c.translate(x + w / 2, y + h / 2);
        c.rotate(rot);
        shadow(true, 12, 5, 0.22);
        c.fillStyle = bg;
        pathFrom(tornPath(rectPts(w, h), 2.2, 5));
        c.fill();
        shadow(false);
        c.fillStyle = fg;
        c.textBaseline = "middle";
        c.textAlign = "center";
        c.fillText(text, 0, size * 0.05);
        c.restore();
      }

      (async () => {
        await Promise.all([document.fonts.load('700 90px "Hyundai Sans Head"'), document.fonts.load('500 30px "Hyundai Sans Head"'), document.fonts.load("600 40px Caveat"), document.fonts.load("700 40px Caveat")]);
        const [siege, formation, mains, decl, logo] = await Promise.all(["assets/img/siege.jpg", "assets/img/formation.jpg", "assets/img/mains.jpg", "assets/img/declaration-p1.jpg", "assets/img/feg-logo.png"].map(load));

        // papier kraft clair
        const g = c.createRadialGradient(900, 480, 200, 960, 540, 1200);
        g.addColorStop(0, "#f1e8d4");
        g.addColorStop(1, "#ddcfb0");
        c.fillStyle = g;
        c.fillRect(0, 0, 1920, 1080);
        grain(0, 0, 1920, 1080, 14, 0.06);
        c.strokeStyle = "rgba(110, 85, 40, 0.07)";
        for (let k = 0; k < 700; k++) {
          const x = rnd() * 1920,
            y = rnd() * 1080,
            a = rnd() * Math.PI,
            l = 8 + rnd() * 26;
          c.beginPath();
          c.moveTo(x, y);
          c.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l);
          c.stroke();
        }

        // le Gabon en papier vert déchiré (contour de la carte du logo)
        {
          const S = 1.62,
            OX = 1010,
            OY = 196;
          const pts = window.GABON_OUTLINE.map(([x, y]) => [OX + (x - 120) * S, OY + y * S]);
          const torn = tornPath(pts, 3.4, 6);
          c.save();
          shadow(true, 20, 9, 0.25);
          c.fillStyle = "#f7f1e1";
          pathFrom(torn.map(([x, y]) => [x + (rnd() - 0.5) * 3, y + (rnd() - 0.5) * 3]));
          c.fill();
          shadow(false);
          c.translate(4, 3);
          c.scale(0.993, 0.993);
          pathFrom(tornPath(pts, 2.2, 6));
          c.fillStyle = GREEN;
          c.fill();
          c.clip();
          grain(900, 150, 900, 800, 14, 0.06);
          // fibres plus claires
          c.strokeStyle = "rgba(255,255,255,0.05)";
          for (let k = 0; k < 400; k++) {
            const x = 950 + rnd() * 800,
              y = 180 + rnd() * 720,
              a = rnd() * Math.PI;
            c.beginPath();
            c.moveTo(x, y);
            c.lineTo(x + Math.cos(a) * 18, y + Math.sin(a) * 18);
            c.stroke();
          }
          c.restore();
        }

        // photos
        photo(siege, 1214, 300, 300, 372, -0.085, { border: 14, bottom: 62, caption: "le siège, immeuble Odyssée", fy: 0.25, clean: true });
        tape(1214, 106, 150, 40, 0.06);
        photo(formation, 965, 760, 480, 270, 0.06, { border: 12 });
        tape(760, 640, 120, 36, -0.7);
        tape(1182, 650, 110, 34, 0.55);
        photo(mains, 1590, 700, 300, 300, 0.1, { border: 12 });
        tape(1590, 540, 140, 38, -0.05);
        photo(decl, 1690, 300, 196, 277, 0.12, { border: 8, clean: true });
        // trombone
        c.save();
        c.translate(1640, 158);
        c.rotate(0.12);
        c.strokeStyle = "#8f938f";
        c.lineWidth = 4;
        c.lineCap = "round";
        c.beginPath();
        c.moveTo(0, 60);
        c.lineTo(0, 0);
        c.arc(12, 0, 12, Math.PI, 0);
        c.lineTo(24, 70);
        c.arc(14, 70, 10, 0, Math.PI);
        c.lineTo(4, 14);
        c.stroke();
        c.restore();

        // titre en bandes de papier (mots de la voix)
        strip("Ceux qui font", 104, 214, -0.03, 84, "#fbf8f0", DEEP);
        strip("l'économie", 128, 338, 0.022, 116, GREEN, "#fbf8f0", 30, 12);
        strip("du pays", 176, 498, -0.018, 84, "#fbf8f0", DEEP);

        // étiquette bronze
        {
          c.save();
          c.translate(345, 772);
          c.rotate(0.035);
          shadow(true, 14, 6, 0.24);
          c.fillStyle = BRONZE;
          pathFrom(tornPath(rectPts(470, 172), 2, 5));
          c.fill();
          shadow(false);
          c.fillStyle = DEEP;
          c.textAlign = "left";
          c.font = '500 34px "Hyundai Sans Head"';
          c.fillText("plus de", -205, -36);
          c.font = '700 92px "Hyundai Sans Head"';
          c.fillText("1 100", -210, 50);
          c.font = '500 34px "Hyundai Sans Head"';
          c.fillText("entreprises", 62, 46);
          c.restore();
        }

        // tampon « depuis 1959 »
        {
          c.save();
          c.translate(745, 905);
          c.rotate(-0.21);
          c.globalAlpha = 0.86;
          c.strokeStyle = "#7d2a1f";
          c.fillStyle = "#7d2a1f";
          c.lineWidth = 6;
          c.beginPath();
          c.arc(0, 0, 92, 0, Math.PI * 2);
          c.stroke();
          c.lineWidth = 2.5;
          c.beginPath();
          c.arc(0, 0, 78, 0, Math.PI * 2);
          c.stroke();
          c.textAlign = "center";
          c.font = '700 26px "Hyundai Sans Head"';
          c.fillText("DEPUIS", 0, -18);
          c.font = '700 58px "Hyundai Sans Head"';
          c.fillText("1959", 0, 38);
          // encre irrégulière : on gratte des petits trous
          c.globalCompositeOperation = "destination-out";
          for (let k = 0; k < 520; k++) {
            const a = rnd() * Math.PI * 2,
              r = rnd() * 96;
            c.fillStyle = `rgba(0,0,0,${0.25 + rnd() * 0.6})`;
            c.beginPath();
            c.arc(Math.cos(a) * r, Math.sin(a) * r, 0.6 + rnd() * 2.2, 0, Math.PI * 2);
            c.fill();
          }
          c.restore();
        }

        // annotations au feutre
        c.save();
        c.strokeStyle = "#0d6b3c";
        c.fillStyle = "#0d6b3c";
        c.lineWidth = 4.5;
        c.lineCap = "round";
        c.lineJoin = "round";
        c.beginPath();
        c.moveTo(600, 735);
        c.bezierCurveTo(700, 690, 800, 640, 905, 610);
        c.stroke();
        c.beginPath();
        c.moveTo(880, 594);
        c.lineTo(908, 609);
        c.lineTo(884, 632);
        c.stroke();
        c.font = "700 52px Caveat";
        c.translate(1395, 985);
        c.rotate(-0.04);
        c.fillText("une seule voix !", 0, 0);
        c.restore();
        c.save();
        c.strokeStyle = "#0d6b3c";
        c.lineWidth = 4;
        c.lineCap = "round";
        c.beginPath();
        c.moveTo(1440, 940);
        c.bezierCurveTo(1440, 905, 1462, 880, 1492, 862);
        c.stroke();
        c.restore();

        // petit logo FEG sur une étiquette blanche
        c.save();
        c.translate(1800, 975);
        c.rotate(-0.04);
        shadow(true, 10, 4, 0.2);
        c.fillStyle = "#fbf8f0";
        pathFrom(tornPath(rectPts(150, 142), 1.6, 5));
        c.fill();
        shadow(false);
        c.drawImage(logo, -60, -56, 120, 111);
        c.restore();

        window.__ready = true;
      })();
    </script>
  </body>
</html>
