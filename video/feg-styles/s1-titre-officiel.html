<!doctype html>
<!-- Aperçu 1 — style « titre officiel » : gravure et guillochis, encre vert profond et bronze sur papier ivoire. -->
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Aperçu — titre officiel</title>
    <link rel="stylesheet" href="fonts.css" />
    <script src="geo.js"></script>
    <style>
      body {
        background: #f2ecdc;
      }
      #paper,
      #art {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
      }
    </style>
  </head>
  <body>
    <canvas id="paper" width="1920" height="1080"></canvas>
    <svg id="art" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg>
    <script>
      const INK = "#0b3a22",
        BRONZE = "#8d874f",
        BRONZE2 = "#aeae7d",
        TINT = "#c9d5bf";
      const NS = "http://www.w3.org/2000/svg";
      const svg = document.getElementById("art");
      function mulberry32(a) {
        return function () {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          let r = Math.imul(a ^ (a >>> 15), 1 | a);
          r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
          return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
        };
      }
      const rnd = mulberry32(1959);
      const el = (tag, attrs = {}, parent = svg) => {
        const e = document.createElementNS(NS, tag);
        for (const k in attrs) e.setAttribute(k, attrs[k]);
        parent.appendChild(e);
        return e;
      };
      const poly = (pts, attrs, parent) => el("path", { d: "M" + pts.map((p) => p[0].toFixed(1) + " " + p[1].toFixed(1)).join("L") + (attrs.close ? "Z" : ""), fill: "none", ...attrs }, parent);

      // papier ivoire : grain et fibres
      {
        const c = document.getElementById("paper").getContext("2d");
        const g = c.createRadialGradient(960, 500, 100, 960, 540, 1150);
        g.addColorStop(0, "#f6f1e3");
        g.addColorStop(1, "#e6dcc4");
        c.fillStyle = g;
        c.fillRect(0, 0, 1920, 1080);
        const img = c.getImageData(0, 0, 1920, 1080);
        for (let i = 0; i < img.data.length; i += 4) {
          const n = (rnd() - 0.5) * 10;
          img.data[i] += n;
          img.data[i + 1] += n;
          img.data[i + 2] += n * 0.8;
        }
        c.putImageData(img, 0, 0);
        c.strokeStyle = "rgba(120,100,60,0.06)";
        for (let k = 0; k < 900; k++) {
          const x = rnd() * 1920,
            y = rnd() * 1080,
            a = rnd() * Math.PI,
            l = 6 + rnd() * 22;
          c.beginPath();
          c.moveTo(x, y);
          c.quadraticCurveTo(x + Math.cos(a) * l * 0.5 + 3, y + Math.sin(a) * l * 0.5, x + Math.cos(a) * l, y + Math.sin(a) * l);
          c.stroke();
        }
      }

      const defs = el("defs");
      // trame de gravure pour les grands chiffres
      {
        const p = el("pattern", { id: "hatch", width: 6, height: 6, patternUnits: "userSpaceOnUse", patternTransform: "rotate(0)" }, defs);
        el("rect", { width: 6, height: 6, fill: "#f4efe2" }, p);
        el("line", { x1: 0, y1: 1.5, x2: 6, y2: 1.5, stroke: INK, "stroke-width": 2.1 }, p);
        el("line", { x1: 0, y1: 4.5, x2: 6, y2: 4.5, stroke: INK, "stroke-width": 1.3 }, p);
      }

      // --- cadre guilloché (quatre bandes ondulées entrelacées)
      const M = 56,
        BW = 34; // marge, largeur de bande
      function band(x0, y0, x1, y1, horiz) {
        const L = horiz ? x1 - x0 : y1 - y0;
        for (let k = 0; k < 7; k++) {
          const ph = (k / 7) * Math.PI * 2;
          const pts = [];
          for (let s = 0; s <= L; s += 2) {
            const off = BW / 2 + (BW / 2 - 3) * Math.sin((s / 46) * Math.PI * 2 + ph) * (0.75 + 0.25 * Math.cos((s / 230) * Math.PI * 2));
            pts.push(horiz ? [x0 + s, y0 + off] : [x0 + off, y0 + s]);
          }
          poly(pts, { stroke: k % 2 ? BRONZE : INK, "stroke-width": 0.9, opacity: 0.85 });
        }
        // filets
        const r = horiz ? [[x0, y0], [x1, y0], [x0, y0 + BW], [x1, y0 + BW]] : [[x0, y0], [x0, y1], [x0 + BW, y0], [x0 + BW, y1]];
        el("line", { x1: r[0][0], y1: r[0][1], x2: r[1][0], y2: r[1][1], stroke: INK, "stroke-width": 1.6 });
        el("line", { x1: r[2][0], y1: r[2][1], x2: r[3][0], y2: r[3][1], stroke: INK, "stroke-width": 1.6 });
      }
      band(M + BW, M, 1920 - M - BW, M, true);
      band(M + BW, 1080 - M - BW, 1920 - M - BW, 1080 - M - BW, true);
      band(M, M + BW, M, 1080 - M - BW, false);
      band(1920 - M - BW, M + BW, 1920 - M - BW, 1080 - M - BW, false);
      // rosaces d'angle
      function rosette(cx, cy, R, n, lines, amp, col, w, op = 1) {
        for (let k = 0; k < lines; k++) {
          const ph = (k / lines) * Math.PI * 2;
          const pts = [];
          for (let i = 0; i <= 720; i++) {
            const t = (i / 720) * Math.PI * 2;
            const rr = R + amp * Math.sin(n * t + ph) + amp * 0.35 * Math.sin((n * 3 + 1) * t - ph * 2);
            pts.push([cx + rr * Math.cos(t), cy + rr * Math.sin(t)]);
          }
          poly(pts, { stroke: col, "stroke-width": w, opacity: op, close: true });
        }
      }
      for (const [cx, cy] of [
        [M + BW / 2, M + BW / 2],
        [1920 - M - BW / 2, M + BW / 2],
        [M + BW / 2, 1080 - M - BW / 2],
        [1920 - M - BW / 2, 1080 - M - BW / 2],
      ]) {
        el("circle", { cx, cy, r: 30, fill: "#efe8d6", stroke: INK, "stroke-width": 1.4 });
        rosette(cx, cy, 19, 9, 8, 7, INK, 0.7);
        el("circle", { cx, cy, r: 4, fill: BRONZE });
      }
      // micro-texte sous la bande du haut et au-dessus de la bande du bas
      const micro = "FÉDÉRATION DES ENTREPRISES DU GABON · DEPUIS 1959 · ".repeat(14);
      {
        const cp = el("clipPath", { id: "microclip" }, defs);
        el("rect", { x: M + BW + 10, y: 0, width: 1920 - 2 * (M + BW + 10), height: 1080 }, cp);
        for (const y of [M + BW + 16, 1080 - M - BW - 8]) {
          const t = el("text", { x: M + BW + 14, y, "font-family": "Source Serif 4", "font-size": 10.5, "letter-spacing": 1.6, fill: INK, opacity: 0.75, "clip-path": "url(#microclip)" });
          t.textContent = micro;
        }
      }

      // --- grande rosace derrière le chiffre
      const RC = [565, 520];
      rosette(RC[0], RC[1], 330, 18, 26, 26, TINT, 1.0, 0.9);
      rosette(RC[0], RC[1], 255, 13, 22, 20, "#d8ccaa", 0.9, 0.9);
      rosette(RC[0], RC[1], 185, 24, 18, 12, TINT, 0.8, 0.9);

      // --- texte (gravé)
      const tKick = el("text", { x: 238, y: 296, "font-family": "Source Serif 4", "font-weight": 600, "font-size": 27, "letter-spacing": 6, fill: INK });
      tKick.textContent = "FÉDÉRATION DES ENTREPRISES DU GABON";
      el("line", { x1: 238, y1: 322, x2: 900, y2: 322, stroke: BRONZE, "stroke-width": 1.4 });
      el("line", { x1: 238, y1: 328, x2: 900, y2: 328, stroke: BRONZE, "stroke-width": 0.6 });
      // ombre portée bronze, puis chiffre en taille-douce
      const big = (dx, dy, attrs) => {
        const t = el("text", { x: 226 + dx, y: 595 + dy, "font-family": "Source Serif 4", "font-weight": 700, "font-size": 300, "letter-spacing": -4, ...attrs });
        t.textContent = "1\u202F100";
        return t;
      };
      big(7, 7, { fill: "none", stroke: BRONZE, "stroke-width": 2 });
      big(0, 0, { fill: "url(#hatch)", stroke: INK, "stroke-width": 3 });
      const tSub = el("text", { x: 238, y: 690, "font-family": "Source Serif 4", "font-style": "italic", "font-size": 60, fill: INK });
      tSub.textContent = "entreprises membres";
      const tSub2 = el("text", { x: 238, y: 760, "font-family": "Source Serif 4", "font-size": 40, fill: BRONZE, "letter-spacing": 1 });
      tSub2.textContent = "réunies depuis 1959, d'une seule voix";

      // --- la carte du Gabon gravée (trame du logo FEG)
      (async () => {
          const dots = window.FEG_DOTS,
            outline = window.GABON_OUTLINE;
          const S = 1.32,
            OX = 1065,
            OY = 225;
          const X = (px) => OX + (px - 100) * S,
            Y = (py) => OY + py * S;
          const g = el("g");
          const clip = el("clipPath", { id: "gab" }, defs);
          poly(
            outline.map(([x, y]) => [X(x), Y(y)]),
            { close: true },
            clip,
          );
          // hachures diagonales à l'intérieur
          const hg = el("g", { "clip-path": "url(#gab)" }, g);
          for (let d = -700; d < 900; d += 7) el("line", { x1: OX - 50 + d, y1: OY - 30, x2: OX - 50 + d + 640, y2: OY + 640, stroke: INK, "stroke-width": 0.7, opacity: 0.32 }, hg);
          // double trait de contour
          poly(
            outline.map(([x, y]) => [X(x), Y(y)]),
            { close: true, stroke: INK, "stroke-width": 2.4 },
            g,
          );
          const cx0 = outline.reduce((a, p) => a + p[0], 0) / outline.length,
            cy0 = outline.reduce((a, p) => a + p[1], 0) / outline.length;
          poly(
            outline.map(([x, y]) => [X(cx0 + (x - cx0) * 1.035), Y(cy0 + (y - cy0) * 1.035)]),
            { close: true, stroke: BRONZE, "stroke-width": 1 },
            g,
          );
          // 71 médailles gravées : anneaux concentriques
          for (const d of dots) {
            const [px, py] = d;
            const cx = X(px),
              cy = Y(py);
            el("circle", { cx, cy, r: 16.5 * S * 0.62 + 4, fill: "#f1ead6" }, g);
            for (let r = 3; r <= 16.5 * S * 0.62 + 2; r += 2.6) el("circle", { cx, cy, r, fill: "none", stroke: r > 12 ? INK : BRONZE, "stroke-width": r > 12 ? 1.1 : 0.8 }, g);
            el("circle", { cx, cy, r: 2.2, fill: INK }, g);
          }
          // sceau bronze
          const SX = 1615,
            SY = 868;
          el("circle", { cx: SX, cy: SY, r: 104, fill: "#efe6cf", stroke: BRONZE, "stroke-width": 2.2 }, g);
          el("circle", { cx: SX, cy: SY, r: 92, fill: "none", stroke: BRONZE, "stroke-width": 0.8 }, g);
          const sg = el("g", {}, g);
          // couronne guillochée du sceau
          for (let k = 0; k < 10; k++) {
            const ph = (k / 10) * Math.PI * 2,
              pts = [];
            for (let i = 0; i <= 600; i++) {
              const t = (i / 600) * Math.PI * 2;
              const rr = 60 + 6 * Math.sin(16 * t + ph);
              pts.push([SX + rr * Math.cos(t), SY + rr * Math.sin(t)]);
            }
            poly(pts, { stroke: BRONZE, "stroke-width": 0.6, close: true }, sg);
          }
          el("path", { id: "sealpath", d: `M ${SX - 79} ${SY} a 79 79 0 1 1 158 0 a 79 79 0 1 1 -158 0`, fill: "none" }, defs);
          const st = el("text", { "font-family": "Source Serif 4", "font-weight": 600, "font-size": 14, fill: BRONZE }, g);
          const tp = el("textPath", { href: "#sealpath", textLength: (2 * Math.PI * 79 * 0.985).toFixed(1), lengthAdjust: "spacing" }, st);
          tp.textContent = "FÉDÉRATION DES ENTREPRISES DU GABON · 1959 · ";
          el("circle", { cx: SX, cy: SY, r: 46, fill: "#efe6cf", stroke: BRONZE, "stroke-width": 1.2 }, g);
          const sf = el("text", { x: SX, y: SY + 15, "text-anchor": "middle", "font-family": "Source Serif 4", "font-weight": 700, "font-size": 40, fill: INK }, g);
          sf.textContent = "FEG";
          await document.fonts.ready;
          window.__ready = true;
        })();
    </script>
  </body>
</html>
