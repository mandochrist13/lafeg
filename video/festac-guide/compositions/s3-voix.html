        <mask id="s3-m2" maskUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080"><path id="s3-mp2" d="M 1062,430 Q 1270,266 1478,470" fill="none" stroke="#FFFFFF" stroke-width="16" /></mask>

      <path d="M 1062,430 Q 1270,266 1478,470" fill="none" stroke="#C8423B" stroke-width="8" stroke-linecap="round" stroke-dasharray="2 18" mask="url(#s3-m2)" />

    <div id="s3-st3" class="s3-st">

        <circle cx="1590" cy="486" r="20" fill="none" stroke="#FFFFFF" stroke-width="4" />
        <path d="M 1570,486 L 1610,486 M 1590,466 C 1580,476 1580,496 1590,506 M 1590,466 C 1600,476 1600,496 1590,506" fill="none" stroke="#FFFFFF" stroke-width="3" />
        <rect x="1438" y="512" width="304" height="18" fill="#1F487C" />

  </div>
  <script>
    (function () {
      var C = window.__FG_CUES;
      var P = window.CNP;
      var K = window.CAST;
      var L = C.local("s3");
      var D = C.sc.s3.dur;

      // hémicycle : trois rangées de délégués autour de la tribune
      var cols = ["#1F487C", "#C8423B", "#D9A21B", "#2E8B4F"],
        skins = ["#5C3A24", "#6E4429", "#4A2D1C", "#7F5236"];
      var seats = "",
        k = 0;
      [
        [176, 7],
        [228, 9],
        [280, 11],
      ].forEach(function (row) {
        var R = row[0],
          N = row[1];
        for (var i = 0; i < N; i++) {
          var a = Math.PI * (1.08 + (0.84 * i) / (N - 1));
          var x = 960 + R * Math.cos(a),
            y = 792 + R * 0.6 * Math.sin(a);
          seats += '<g transform="translate(' + x + "," + y + ") scale(1.25) translate(" + -x + "," + -y + ')"><path d="M ' + (x - 15) + "," + (y + 20) + " C " + (x - 15) + "," + (y + 4) + " " + (x - 8) + "," + y + " " + x + "," + y + " C " + (x + 8) + "," + y + " " + (x + 15) + "," + (y + 4) + " " + (x + 15) + "," + (y + 20) + ' Z" fill="' + cols[k % 4] + '"/>';
          seats += '<circle cx="' + x + '" cy="' + (y - 8) + '" r="9" fill="' + skins[(k * 3) % 4] + '"/></g>';
          k++;
        }
      });
      document.getElementById("s3-seats").innerHTML = seats;
      // drapeaux génériques devant le palais
      var fl = "",
        fc = [
          ["#2E8B4F", "#D9A21B"],
          ["#C8423B", "#FFFFFF"],
          ["#1F487C", "#D9A21B"],
          ["#D9A21B", "#2E8B4F"],
          ["#14325A", "#C8423B"],
          ["#2E8B4F", "#FFFFFF"],
        ];
      fc.forEach(function (c, i) {
        var x = 1420 + i * 66;
        fl += '<rect x="' + x + '" y="590" width="5" height="200" fill="#8A97A8"/>';
        fl += '<g class="s3-flag" id="s3-f' + i + '"><rect x="' + (x + 5) + '" y="592" width="44" height="30" fill="' + c[0] + '"/><rect x="' + (x + 5) + '" y="604" width="44" height="8" fill="' + c[1] + '"/></g>';
      });
      document.getElementById("s3-flags").innerHTML = fl;

      // votre syndicat : trois délégués côte à côte (Koffi au centre parle)
      var grp = [
        { id: "g1", name: "aminata", x: 214, s: 0.72 },
        { id: "g3", name: "mba", x: 446, s: 0.72 },
        { id: "g2", name: "koffi", x: 330, s: 0.78 },
      ];
      document.getElementById("s3-group").innerHTML = grp
        .map(function (g) {
          return P.front(g.id, K.with(g.name, { x: g.x, y: 786, s: g.s, cut: 0 }));
        })
        .join("");
      grp.forEach(function (g) {
        P.prep(g.id);
        gsap.set("#" + g.id + "-uaL", { rotation: 4 });
        gsap.set("#" + g.id + "-uaR", { rotation: -4 });
      });

      var tl = gsap.timeline({ paused: true });
      tl.fromTo(".s3-bar4", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, 0.1);
      tl.fromTo("#s3-kick", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" }, L(C.at("L03", "en")) - 0.15);
      // « votre syndicat »
      var tS = L(C.at("L03", "votre")) - 0.2;
      tl.fromTo("#s3-group", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, L(C.at("L03", "rejoignant")) - 0.2);
      tl.fromTo("#s3-l1", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, tS);
      grp.forEach(function (g, i) {
        P.breathe(tl, g.id, 0.3, D, 3 + 0.3 * i, 0.009);
        P.blink(tl, g.id, [1.6 + 0.4 * i, 5.2 + 0.3 * i]);
      });
      // « parle d'une voix plus forte » : Koffi parle, la bulle et les ondes grandissent
      var tP = L(C.at("L03", "parle")) - 0.15;
      tl.fromTo("#s3-bub", { opacity: 0, scale: 0.4, svgOrigin: "348 434" }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, tP);
      for (var q = 0; q < 4; q++) tl.to("#g2-mouth", { scaleY: q % 2 ? 1 : 1.7, scaleX: q % 2 ? 1 : 1.1, duration: 0.14, ease: "sine.inOut" }, tP + 0.1 + q * 0.16);
      tl.to("#g2-head", { rotation: -4, duration: 0.4, ease: "power2.inOut" }, tP);
      ["#s3-w1", "#s3-w2", "#s3-w3"].forEach(function (w, i) {
        tl.fromTo(w, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, tP + 0.25 + 0.12 * i);
      });
      var tF = L(C.at("L03", "plus")) - 0.05;
      tl.to("#s3-title span", { color: "#C8423B", duration: 0.2, stagger: 0.05 }, tF - 0.3);
      tl.fromTo("#s3-title", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.25);
      tl.to("#s3-title span", { color: "#14325A", duration: 0.4 }, tF + 0.9);
      tl.fromTo(["#s3-w1", "#s3-w2", "#s3-w3"], { scale: 1, svgOrigin: "366 369" }, { scale: 1.32, duration: 0.35, ease: "back.out(2.4)", stagger: 0.06 }, tF);
      tl.to("#s3-bub", { scale: 1.12, duration: 0.3, ease: "back.out(2.4)" }, tF);

      // « à l'Assemblée générale de la fédération »
      var tA = L(C.at("L03", "lassemblee")) - 0.45;
      var len1 = document.getElementById("s3-mp1").getTotalLength(),
        len2 = document.getElementById("s3-mp2").getTotalLength();
      gsap.set("#s3-mp1", { strokeDasharray: len1 + " " + len1, strokeDashoffset: len1 });
      gsap.set("#s3-mp2", { strokeDasharray: len2 + " " + len2, strokeDashoffset: len2 });
      tl.to("#s3-mp1", { strokeDashoffset: 0, duration: 0.6, ease: "power2.inOut" }, tA - 0.3);
      tl.fromTo("#s3-e1", { scale: 0, svgOrigin: "862 430" }, { scale: 1, duration: 0.3, ease: "back.out(3)" }, tA + 0.25);
      tl.fromTo("#s3-st2", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, tA + 0.15);
      tl.fromTo("#s3-seats path, #s3-seats circle", { opacity: 0 }, { opacity: 1, duration: 0.2, stagger: 0.012, ease: "power1.out" }, tA + 0.25);
      tl.fromTo("#s3-l2", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, tA + 0.35);
      tl.fromTo("#s3-aglogo", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, L(C.at("L03", "federation")) - 0.15);

      // « et jusqu'aux travaux de la Conférence internationale du Travail »
      var tC = L(C.at("L03", "conference")) - 0.35;
      tl.to("#s3-mp2", { strokeDashoffset: 0, duration: 0.75, ease: "power2.inOut" }, L(C.at("L03", "jusquaux")) - 0.1);
      tl.fromTo("#s3-e2", { scale: 0, svgOrigin: "1478 470" }, { scale: 1, duration: 0.3, ease: "back.out(3)" }, L(C.at("L03", "jusquaux")) + 0.6);
      tl.fromTo("#s3-st3", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, tC - 0.2);
      tl.fromTo(".s3-flag", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.3, stagger: 0.06, ease: "power2.out" }, tC + 0.1);
      tl.fromTo("#s3-l3", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, tC);
      tl.fromTo("#s3-geneve", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, L(C.at("L03", "travail")) - 0.1);
      // la voix (les ondes) gagne chaque étape
      tl.to(["#s3-w1", "#s3-w2", "#s3-w3"], { opacity: 0.35, duration: 0.3 }, tC + 1.2);

      // sortie
      tl.to(["#s3-title", "#s3-kick", ".s3-bar4", ".s3-lab", "#s3-geneve"], { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power3.in" }, D - 0.36);
      tl.to(["#s3-st1", "#s3-st2", "#s3-st3", "#s3-arcs", "#s3-l1"], { opacity: 0, duration: 0.3, ease: "power2.in" }, D - 0.34);
      window.__timelines["s3"] = tl;
    })();
  </script>
</template>
