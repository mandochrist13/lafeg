    <svg class="s9-abs" width="1920" height="1080" viewBox="0 0 1920 1080">

    </svg>
    <div id="s9-people" class="s9-abs"></div>
    <img id="s9-logo" src="assets/img/cnamgs-logo.png" alt="CNAMGS — Caisse Nationale d'Assurance Maladie et de Garantie Sociale" />
    <div id="s9-txt">
      <div id="s9-pre" class="s9-c"><span>Ne</span> <span>restez</span> <span>pas</span> <span>sans</span> <span>couverture</span></div>
      <div id="s9-cta" class="s9-c"><span>Faites-vous</span> <span>immatriculer</span> <span>au</span> <span>Fonds</span> <span class="four">4</span></div>
      <div id="s9-slo" class="s9-c"><span>La</span> <span>solidarité</span> <span>a</span> <span>un</span> <span>sens</span></div>
      <div id="s9-url" class="s9-c">www.cnamgs.ga</div>
    </div>
  </div>
  <script>
    (function () {
      var C = window.__CN_CUES;
      var P = window.CNP;
      var K = window.CAST;
      var L = C.local("s9");
      var D = C.sc.s9.dur;
      // les six travailleurs du début, côte à côte ; sur « La solidarité », ils se donnent la main
      var S = 0.56,
        FEET = 1040,
        Y = FEET - 304 * S,
        GAP = 230;
      var cast = ["infirmiere", "avocat", "awa", "moussa", "chauffeur", "jardinier"];
      var ids = [];
      document.getElementById("s9-people").innerHTML = cast
        .map(function (n, i) {
          ids.push("f" + i);
          return P.front("f" + i, K.with(n, { x: 960 + (i - 2.5) * GAP, y: Y, s: S, legs: true }));
        })
        .join("");
      var tl = gsap.timeline({ paused: true });
      function joinAngle(name) {
        var sx = (K[name].sex === "m" ? 79 : 70) * S;
        return (Math.asin((GAP / 2 - sx) / (220 * S)) * 180) / Math.PI;
      }
      var tJoin = L(C.at("L11", ["solidarite"])) - 0.1;
      cast.forEach(function (n, i) {
        var id = ids[i];
        P.prep(id);
        gsap.set("#" + id + "-uaL", { rotation: 4 });
        gsap.set("#" + id + "-uaR", { rotation: -4 });
        tl.fromTo("#" + id, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.05 + Math.abs(i - 2.5) * 0.08);
        var a = joinAngle(n),
          d = Math.abs(i - 2.5) * 0.05;
        if (i > 0) tl.to("#" + id + "-uaL", { rotation: a, duration: 0.55, ease: "power2.inOut" }, tJoin + d);
        if (i < cast.length - 1) tl.to("#" + id + "-uaR", { rotation: -a, duration: 0.55, ease: "power2.inOut" }, tJoin + d + 0.03);
        tl.to("#" + id + "-mouth", { scaleX: 1.12, scaleY: 1.35, duration: 0.35, ease: "power2.out" }, tJoin + 0.3 + d);
        P.breathe(tl, id, 0.1 * i, D, 3.2 + 0.3 * (i % 3), 0.007);
        P.blink(tl, id, [1.2 + 0.37 * i, 7.5 + 0.41 * i]);
      });

      // « Ne restez pas sans couverture » puis « faites-vous immatriculer au Fonds 4 »
      gsap.set("#s9-txt", { y: -150 });
      tl.fromTo("#s9-pre span", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.15, stagger: 0.08, ease: "power4.out" }, L(C.at("L11", ["ne"])) - 0.1);
      var tCta = L(C.at("L11", ["faitesvous"])) - 0.15;
      tl.fromTo("#s9-cta span", { opacity: 0, filter: "blur(6px)", y: 16 }, { opacity: 1, filter: "blur(0px)", y: 0, duration: 0.16, stagger: 0.12, ease: "power4.out" }, tCta);
      tl.fromTo("#s9-cta .four", { scale: 0.6 }, { scale: 1, duration: 0.4, ease: "back.out(2.2)" }, L(C.at("L11", ["fonds"])) + 0.05);
      // « La solidarité a un sens »
      tl.fromTo("#s9-slo span", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, stagger: 0.1, ease: "power4.out" }, tJoin);
      // le logo se pose sur l'accord final de la musique ; le texte descend lui faire place
      var tLogo = C.logo - C.sc.s9.start;
      tl.to("#s9-pre", { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power3.in" }, tLogo - 0.6);
      tl.to("#s9-txt", { y: 0, duration: 0.7, ease: "power3.inOut" }, tLogo - 0.45);
      tl.fromTo("#s9-logo", { clipPath: "inset(0% 100% 0% 0%)", opacity: 1 }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.95, ease: "power2.inOut" }, tLogo);
      tl.fromTo("#s9-url", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, tLogo + 0.9);
      // les visages se lèvent un peu vers le logo
      ids.forEach(function (id, i) {
        tl.to("#" + id + "-head", { y: -3, rotation: (2.5 - i) * 0.9, duration: 0.6, ease: "power2.inOut" }, tLogo + 0.2 + i * 0.04);
      });
      window.__timelines["s9"] = tl;
    })();
  </script>
