  <script>
    (function () {
      var C = window.__FG_CUES;
      var P = window.CNP;
      var K = window.CAST;
      var L = C.local("s1");
      var D = C.sc.s1.dur;

      // livres de l'étagère du responsable syndical
      var cols = ["#1F487C", "#C8423B", "#D9A21B", "#2E8B4F", "#5B6573", "#14325A"];
      var books = "";
      [126, 190, 254].forEach(function (y, r) {
        var x = 54,
          k = r * 2;
        while (x < 192) {
          var w = 12 + ((k * 7) % 3) * 3,
            h = 40 + ((k * 5) % 4) * 4;
          books += '<rect x="' + x + '" y="' + (y - h) + '" width="' + w + '" height="' + h + '" rx="2" fill="' + cols[k % cols.length] + '"/>';
          x += w + 3;
          k++;
        }
      });
      document.getElementById("s1-books").innerHTML = books;

      // les trois personnages, en buste (repère du panneau 500 × 500)
      var who = [
        { id: "v0", name: "aminata" },
        { id: "v1", name: "koffi" },
        { id: "v2", name: "mba" },
      ];
      who.forEach(function (w, i) {
        document.getElementById("s1-w" + i).innerHTML = P.front(w.id, K.with(w.name, { x: 250, y: 482, s: 1.05 }));
        P.prep(w.id);
        gsap.set("#" + w.id + "-uaL", { rotation: 4 });
        gsap.set("#" + w.id + "-uaR", { rotation: -4 });
      });

      var tl = gsap.timeline({ paused: true });
      // ouverture : le logo et le titre ; lente poussée jusqu'à la première phrase
      // (le logo et le titre sont là dès la première image : c'est la vignette du film)
      tl.fromTo("#s1-intro", { scale: 1 }, { scale: 1.04, duration: 2.9, ease: "none", transformOrigin: "50% 50%" }, 0);
      tl.to("#s1-intro", { opacity: 0, y: -40, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 2.85);

      // « Vous êtes… »
      tl.fromTo("#s1-q span", { opacity: 0, filter: "blur(6px)", y: 14 }, { opacity: 1, filter: "blur(0px)", y: 0, duration: 0.2, stagger: 0.16, ease: "power4.out" }, L(C.at("L01", "vous")) - 0.1);

      // chaque représentant entre sur son mot
      var cue = [L(C.at("L01", "delegue")) - 0.12, L(C.at("L01", "syndical")) - 0.55, L(C.at("L01", "responsable")) - 0.12];
      cue.forEach(function (t, i) {
        var id = who[i].id;
        tl.fromTo("#s1-p" + i, { opacity: 0, y: 40, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "power3.out" }, t);
        tl.fromTo("#s1-w" + i, { y: 60 }, { y: 0, duration: 0.65, ease: "power3.out" }, t + 0.05);
        tl.fromTo("#s1-l" + i, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, t + 0.25);
        tl.fromTo("#" + id + "-head", { rotation: i % 2 ? 5 : -5 }, { rotation: 0, duration: 0.7, ease: "power2.out" }, t + 0.2);
        tl.to("#" + id + "-mouth", { scaleX: 1.12, scaleY: 1.3, duration: 0.3, ease: "power2.out" }, t + 0.35);
        P.breathe(tl, id, t, D, 3.1 + 0.25 * i, 0.009);
        P.blink(tl, id, [t + 1.3 + 0.3 * i, t + 4.1 + 0.25 * i]);
      });

      // « dans une institution de sécurité sociale ? »
      var tI = L(C.at("L01", "institution")) - 0.35;
      tl.fromTo("#s1-instp", { opacity: 0, y: 24, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.8)" }, tI);

      // « Cette vidéo est pour vous » : les trois sourient
      var tP = L(C.at("L01", "cette")) - 0.15;
      tl.to("#s1-instp", { opacity: 0, y: -16, filter: "blur(6px)", duration: 0.3, ease: "power3.in" }, tP - 0.3);
      tl.fromTo("#s1-pour span", { opacity: 0, filter: "blur(6px)", y: 16 }, { opacity: 1, filter: "blur(0px)", y: 0, duration: 0.2, stagger: 0.12, ease: "power4.out" }, tP);
      var tV = L(C.at("L01", "pour")) - 0.1;
      who.forEach(function (w, i) {
        tl.to("#" + w.id + "-mouth", { scaleX: 1.25, scaleY: 1.6, duration: 0.3, ease: "power2.out" }, tV + 0.05 * i);
        tl.to("#" + w.id + "-head", { rotation: (1 - i) * 3, y: -2, duration: 0.5, ease: "power2.inOut" }, tV + 0.05 * i);
      });
      // un signe de tête, et les trois panneaux s'éclairent d'un liseré or
      who.forEach(function (w, i) {
        tl.to("#" + w.id + "-head", { rotation: (1 - i) * 3 + 4, duration: 0.22, ease: "sine.inOut" }, tV + 0.5 + 0.06 * i).to(
          "#" + w.id + "-head",
          { rotation: (1 - i) * 3, duration: 0.3, ease: "sine.inOut" },
          tV + 0.72 + 0.06 * i,
        );
      });
      tl.fromTo(".s1-pan", { boxShadow: "0 0 0 0px rgba(217,162,27,0)" }, { boxShadow: "0 0 0 8px rgba(217,162,27,1)", duration: 0.35, stagger: 0.08, ease: "power2.out" }, tV);

      // sortie
      tl.to(["#s1-q", "#s1-pour", ".s1-lab"], { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power3.in" }, D - 0.36);
      tl.to(".s1-pan", { opacity: 0, scale: 0.94, y: 20, duration: 0.34, stagger: 0.04, ease: "power3.in" }, D - 0.4);
      window.__timelines["s1"] = tl;
    })();
  </script>
