  <script>
    (function () {
      var C = window.__FG_CUES;
      var L = C.local("s2");
      var D = C.sc.s2.dur;
      var A = window.FS_AFRICA;

      // ---- la carte (cases de 0,6° ; y vers le sud)
      var X0 = 1020,
        Y0 = 186,
        CELL = 13.6,
        SZ = 11.2;
      var base = "",
        mem = {};
      A.members.forEach(function (c) {
        mem[c] = "";
      });
      A.tiles.forEach(function (t) {
        var code = A.codes[t[2]];
        var x = (X0 + t[0] * CELL).toFixed(1),
          y = (Y0 + t[1] * CELL).toFixed(1);
        var r = '<rect x="' + x + '" y="' + y + '" width="' + SZ + '" height="' + SZ + '" rx="3"/>';
        base += r;
        if (mem[code] !== undefined) mem[code] += r;
      });
      document.getElementById("s2-base").innerHTML = '<g fill="#DDE3EA">' + base + "</g>";
      // ordre d'allumage : d'ouest en est
      var order = ["SEN", "GIN", "MLI", "CIV", "BFA", "TGO", "BEN", "NER", "CMR", "GAB"];
      document.getElementById("s2-mem").innerHTML = order
        .map(function (c) {
          return '<g id="s2-m-' + c + '" fill="' + (c === "GAB" ? "#C8423B" : "#1F487C") + '">' + mem[c] + "</g>";
        })
        .join("");
      var lbv = A.cities.LBV;
      var px = X0 + lbv[0] * CELL + SZ / 2,
        py = Y0 + lbv[1] * CELL + SZ / 2;
      gsap.set("#s2-pin", { x: px, y: py });

      // ---- les six syndicats autour du logo
      var cx = 480,
        cy = 430;
      var spots = [
        [128, 250, "#1F487C"],
        [150, 640, "#C8423B"],
        [480, 770, "#D9A21B"],
        [810, 640, "#2E8B4F"],
        [832, 250, "#C8423B"],
        [480, 150, "#1F487C"],
      ];
      var pict =
        '<svg width="108" height="108" viewBox="0 0 108 108"><g fill="#FFFFFF">' +
        '<circle cx="34" cy="44" r="10"/><path d="M 18,78 C 18,62 26,57 34,57 C 42,57 50,62 50,78 Z" opacity="0.85"/>' +
        '<circle cx="74" cy="44" r="10"/><path d="M 58,78 C 58,62 66,57 74,57 C 82,57 90,62 90,78 Z" opacity="0.85"/>' +
        '<circle cx="54" cy="38" r="12"/><path d="M 34,80 C 34,60 44,53 54,53 C 64,53 74,60 74,80 Z"/></g></svg>';
      var us = "",
        links = "";
      spots.forEach(function (p, i) {
        us += '<div id="s2-u' + i + '" class="s2-u" style="left:' + p[0] + "px;top:" + p[1] + "px;background:" + p[2] + '">' + pict + "</div>";
        links += '<line id="s2-k' + i + '" x1="' + p[0] + '" y1="' + p[1] + '" x2="' + cx + '" y2="' + cy + '" stroke="#C9D3DF" stroke-width="5" stroke-dasharray="2 12" stroke-linecap="round"/>';
      });
      document.getElementById("s2-us").innerHTML = us;
      document.getElementById("s2-links").innerHTML = links;

      var tl = gsap.timeline({ paused: true });
      // « La FESTAC »
      tl.fromTo("#s2-logo", { opacity: 0, scale: 0.86, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.6)" }, L(C.at("L02", "festac")) - 0.3);
      // « fédère les syndicats » : chaque syndicat arrive, relié au logo
      var tF = L(C.at("L02", "federe")) - 0.1;
      spots.forEach(function (p, i) {
        var dx = (p[0] - cx) * 0.35,
          dy = (p[1] - cy) * 0.35;
        tl.fromTo("#s2-u" + i, { opacity: 0, x: dx, y: dy, scale: 0.5 }, { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.7)" }, tF + 0.11 * i);
        tl.fromTo("#s2-k" + i, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, tF + 0.11 * i + 0.25);
      });
      tl.to(".s2-u", { scale: 1.08, duration: 0.18, ease: "sine.out", yoyo: true, repeat: 1, stagger: 0.05 }, L(C.at("L02", "syndicats")) + 0.15);
      // « des travailleurs de la prévoyance sociale »
      tl.fromTo("#s2-capp", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, L(C.at("L02", "travailleurs")) - 0.15);

      // la carte apparaît, puis les pays membres s'allument (« dans les pays affiliés »)
      tl.fromTo("#s2-base", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, L(C.at("L02", "prevoyance")) - 0.3);
      var tM = L(C.at("L02", "pays")) - 0.2;
      tl.fromTo("#s2-head", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, tM);
      order.forEach(function (c, i) {
        tl.fromTo("#s2-m-" + c, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, tM + 0.09 * i);
      });
      tl.fromTo("#s2-list", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, tM + 0.7);

      // « Son siège est à Libreville » : l'épingle tombe sur Libreville
      var tS = L(C.at("L02", "siege")) - 0.1;
      tl.fromTo("#s2-pinb", { y: -90, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "bounce.out" }, tS);
      tl.fromTo("#s2-pinsh", { scale: 0.3, opacity: 0, svgOrigin: "0 0" }, { scale: 1, opacity: 0.22, duration: 0.5, ease: "power2.out" }, tS);
      tl.fromTo("#s2-seat", { opacity: 0, x: 24 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, L(C.at("L02", "libreville")) - 0.15);
      tl.to("#s2-m-GAB", { opacity: 0.55, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 3 }, L(C.at("L02", "libreville")));

      // sortie
      tl.to(["#s2-logo", "#s2-us", "#s2-links", "#s2-cap", "#s2-head", "#s2-list", "#s2-seat", "#s2-map"], { opacity: 0, filter: "blur(6px)", duration: 0.32, ease: "power3.in" }, D - 0.36);
      window.__timelines["s2"] = tl;
    })();
  </script>
