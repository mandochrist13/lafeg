<!doctype html>
<!--
  FEG — « De la voix à la réforme », carnet de croquis. Dix pages de carnet posées sur un bureau (deux rangées
  de cinq, parcourues en serpentin) ; la caméra glisse de page en page pendant que tout se dessine en direct :
  traits rough.js qui se révèlent, lavis vert par couches, écriture manuscrite lettre par lettre, stylo plume
  dont la pointe suit le trait en cours. À la fin, recul sur le carnet entier.
  Tout ce qui est visible est render(t), fonction pure du temps (horloge GSAP linéaire) ; temps : assets/cues.js.
-->
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>FEG — Carnet de croquis</title>
    <style>
      @font-face {
        font-family: "Caveat";
        font-weight: 400;
        src: url("assets/fonts/caveat-latin-400-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Caveat";
        font-weight: 600;
        src: url("assets/fonts/caveat-latin-600-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Caveat";
        font-weight: 700;
        src: url("assets/fonts/caveat-latin-700-normal.woff2") format("woff2");
      }
      #world-root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #221d18;
      }
      #stage-wrap {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
      }
      #stage {
        display: block;
        width: 1920px;
        height: 1080px;
      }
    </style>
  </head>
  <body>
    <div
      id="world-root"
      data-composition-id="world"
      data-start="0"
      data-duration="86.731" data-total
      data-width="1920"
      data-height="1080"
      data-layout-allow-overlap
    >
      <div id="stage-wrap" class="clip" data-start="0" data-duration="86.731" data-total data-track-index="0" data-layout-allow-overflow>
        <svg id="stage" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
          <defs id="defs"></defs>
          <g id="cam">
            <g id="desk"></g>
            <g id="shadows"></g>
            <g id="papers"></g>
            <g id="content"></g>
            <g id="pen"></g>
          </g>
        </svg>
      </div>
    </div>

    <script>
      (function () {
        var C = window.__FL_CUES;
        var total = C ? C.total : 86.731;
        var host = { clock: { t: 0 }, render: null };
        window.__worldHost = host;
        window.__hf = window.__hf || {};
        window.__hf.buildReady = window.__hf.buildReady || {};
        window.__hf.buildReady["world"] = new Promise(function (resolve) {
          host.ready = resolve;
        });
        var tl = gsap.timeline({ paused: true });
        tl.to(host.clock, {
          t: total,
          duration: total,
          ease: "none",
          onUpdate: function () {
            if (host.render) host.render(host.clock.t);
          },
        });
        window.__timelines = window.__timelines || {};
        window.__timelines["world"] = tl;
      })();
    </script>

    <script type="module">
      import rough from "./lib/rough.esm.js";
      import "./assets/geo.js";

      const host = window.__worldHost;
      const C = window.__FL_CUES;
      const at = (id, w, which) => C.at(id, w, which);
      const norm = (s) =>
        String(s)
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .replace(/[^a-z0-9%]+/g, "");
      // dernière occurrence d'un mot dans une phrase
      const atLast = (id, needle, which = "s") => {
        const n = norm(needle);
        const ws = C.lines[id].words.filter((w) => w.n && (w.n === n || w.n.indexOf(n) === 0));
        return ws.length ? ws[ws.length - 1][which] : C.lines[id].start;
      };

      // ------------------------------------------------------------------ outils
      const clamp01 = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
      const lerp = (a, b, u) => a + (b - a) * u;
      const prog = (t, t0, d) => clamp01((t - t0) / d);
      const inOut = (u) => ((u = clamp01(u)), u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
      const out3 = (u) => 1 - Math.pow(1 - clamp01(u), 3);
      const outBack = (u) => {
        u = clamp01(u);
        const c1 = 1.70158,
          c3 = c1 + 1;
        return 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2);
      };
      function mulberry32(a) {
        return function () {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          let r = Math.imul(a ^ (a >>> 15), 1 | a);
          r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
          return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
        };
      }

      const INK = "#1e2a3a",
        GREEN = "#2f8f57",
        GREEN_H = "rgba(47,143,87,0.9)",
        BRONZE = "#9a8f4e",
        BRONZE_H = "rgba(154,143,78,0.85)",
        PAPER = "#f4eee0";
      const NS = "http://www.w3.org/2000/svg";
      const svg = document.getElementById("stage");
      const defs = document.getElementById("defs");
      const camG = document.getElementById("cam");
      const deskG = document.getElementById("desk");
      const shadowsG = document.getElementById("shadows");
      const papersG = document.getElementById("papers");
      const contentG = document.getElementById("content");
      const penG = document.getElementById("pen");
      const rc = rough.svg(svg);
      const el = (tag, attrs = {}, parent = null) => {
        const e = document.createElementNS(NS, tag);
        for (const k in attrs) e.setAttribute(k, attrs[k]);
        if (parent) parent.appendChild(e);
        return e;
      };

      // ------------------------------------------------------------------ le carnet : dix pages, deux rangées, en serpentin
      // page de 1760 × 1100 ; le contenu est dessiné sur 1600 de large, centré (marge de 80)
      const PW = 1760,
        PH = 1100,
        GX = 90,
        GY = 110,
        CX0 = 80;
      const WORLD_W = 5 * PW + 4 * GX,
        WORLD_H = 2 * PH + GY;
      const pageOrigin = (k) => {
        const row = k < 5 ? 0 : 1,
          col = k < 5 ? k : 9 - k;
        return [col * (PW + GX), row * (PH + GY)];
      };
      const pageCenter = (k) => {
        const [x, y] = pageOrigin(k);
        return [x + PW / 2, y + PH / 2 - 15];
      };

      // textures (papier, ombre, bureau), calculées une fois, déterministes
      function canvas(w, h) {
        const c = document.createElement("canvas");
        c.width = w;
        c.height = h;
        return [c, c.getContext("2d")];
      }
      function paperTexture(seed) {
        const [c, x] = canvas(PW, PH);
        const r = mulberry32(seed);
        x.fillStyle = PAPER;
        x.fillRect(0, 0, PW, PH);
        const g = x.createRadialGradient(PW / 2, PH / 2, 260, PW / 2, PH / 2, 1150);
        g.addColorStop(0, "rgba(255,252,242,0.25)");
        g.addColorStop(1, "rgba(150,118,66,0.16)");
        x.fillStyle = g;
        x.fillRect(0, 0, PW, PH);
        for (let k = 0; k < 34000; k++) {
          x.fillStyle = r() < 0.5 ? "rgba(255,255,255,0.11)" : "rgba(90,70,30,0.055)";
          x.fillRect(r() * PW, r() * PH, 1.5, 1.5);
        }
        x.strokeStyle = "rgba(110,85,40,0.05)";
        for (let k = 0; k < 500; k++) {
          const px = r() * PW,
            py = r() * PH,
            a = r() * Math.PI;
          x.beginPath();
          x.moveTo(px, py);
          x.lineTo(px + Math.cos(a) * 14, py + Math.sin(a) * 14);
          x.stroke();
        }
        x.fillStyle = "rgba(120,105,70,0.24)";
        for (let gx = 34; gx < PW - 10; gx += 34) for (let gy = 34; gy < PH - 10; gy += 34) x.fillRect(gx - 1.2, gy - 1.2, 2.4, 2.4);
        // bord supérieur : marque de la reliure arrachée
        x.fillStyle = "rgba(120,100,60,0.12)";
        for (let gx = 40; gx < PW; gx += 46) {
          x.beginPath();
          x.arc(gx, 16, 4.5, 0, Math.PI * 2);
          x.fill();
        }
        return c.toDataURL("image/jpeg", 0.9);
      }
      function shadowTexture() {
        const m = 70;
        const [c, x] = canvas(PW + 2 * m, PH + 2 * m);
        x.filter = "blur(24px)";
        x.fillStyle = "rgba(0,0,0,0.62)";
        x.fillRect(m, m, PW, PH);
        return { url: c.toDataURL("image/png"), m };
      }
      function deskPattern() {
        const [c, x] = canvas(256, 256);
        const r = mulberry32(77);
        x.fillStyle = "#221d18";
        x.fillRect(0, 0, 256, 256);
        for (let k = 0; k < 3000; k++) {
          x.fillStyle = r() < 0.5 ? "rgba(255,240,210,0.035)" : "rgba(0,0,0,0.12)";
          x.fillRect(r() * 256, r() * 256, 1 + r() * 2, 1);
        }
        return c.toDataURL("image/png");
      }

      // lavis à l'aquarelle : couches translucides, bord plus foncé, grain du pigment
      function washImage(drawShape, bbox, color, seed) {
        const m = 34;
        const W = Math.ceil(bbox.w + 2 * m),
          H = Math.ceil(bbox.h + 2 * m);
        const [c, x] = canvas(W, H);
        const r = mulberry32(seed);
        x.translate(m - bbox.x, m - bbox.y);
        for (let l = 0; l < 9; l++) {
          x.save();
          x.globalAlpha = 0.085;
          x.fillStyle = color;
          x.translate((r() - 0.5) * 9, (r() - 0.5) * 9);
          drawShape(x, r);
          x.fill();
          x.restore();
        }
        x.save();
        x.globalAlpha = 0.16;
        x.strokeStyle = color;
        x.lineWidth = 3.2;
        x.filter = "blur(1.6px)";
        drawShape(x, r);
        x.stroke();
        x.restore();
        x.save();
        drawShape(x, r);
        x.clip();
        for (let k = 0; k < (bbox.w * bbox.h) / 90; k++) {
          x.fillStyle = r() < 0.6 ? "rgba(30,90,55,0.06)" : "rgba(255,255,255,0.08)";
          x.fillRect(bbox.x + r() * bbox.w, bbox.y + r() * bbox.h, 1.6, 1.6);
        }
        x.restore();
        return { url: c.toDataURL("image/png"), x: bbox.x - m, y: bbox.y - m, w: W, h: H };
      }
      const blobShape = (cx, cy, rx, ry, seed) => {
        const base = mulberry32(seed);
        const ph = [base() * 6.28, base() * 6.28, base() * 6.28];
        return (x, r) => {
          x.beginPath();
          for (let i = 0; i <= 48; i++) {
            const a = (i / 48) * Math.PI * 2;
            const k = 1 + 0.07 * Math.sin(a * 3 + ph[0]) + 0.05 * Math.sin(a * 5 + ph[1]) + (r() - 0.5) * 0.05;
            const px = cx + Math.cos(a) * rx * k,
              py = cy + Math.sin(a) * ry * k;
            i ? x.lineTo(px, py) : x.moveTo(px, py);
          }
          x.closePath();
        };
      };
      const polyShape = (pts) => (x, r) => {
        x.beginPath();
        pts.forEach(([px, py], i) => (i ? x.lineTo(px + (r() - 0.5) * 3, py + (r() - 0.5) * 3) : x.moveTo(px, py)));
        x.closePath();
      };

      // ------------------------------------------------------------------ éléments animés
      const items = []; // chacun : update(t)
      const penItems = []; // éléments tracés au stylo : t0, dur, pointAt(t) en coordonnées du monde
      let SEED = 11;
      const O = (o = {}) => ({ roughness: 1.25, bowing: 1.1, stroke: INK, strokeWidth: 2.8, disableMultiStroke: true, disableMultiStrokeFill: true, seed: SEED++, ...o });
      const HATCH = (col = GREEN_H, o = {}) => ({ fill: col, fillStyle: "hachure", hachureGap: 9, fillWeight: 1.9, hachureAngle: -41, ...o });

      const pages = [];
      const PAPER_URLS = [paperTexture(3), paperTexture(5)];
      const SHADOW = shadowTexture();
      for (let k = 0; k < 10; k++) {
        const [px, py] = pageOrigin(k);
        el("image", { href: SHADOW.url, x: px - SHADOW.m + 12, y: py - SHADOW.m + 20, width: PW + 2 * SHADOW.m, height: PH + 2 * SHADOW.m }, shadowsG);
        el("image", { href: PAPER_URLS[k % 2], x: px, y: py, width: PW, height: PH }, papersG);
        const g = el("g", { transform: `translate(${px + CX0} ${py})` }, contentG);
        const wash = el("g", {}, g),
          ink = el("g", {}, g);
        pages.push({ k, px: px + CX0, py, g, wash, ink });
      }
      // bureau
      {
        const pid = "deskpat";
        const p = el("pattern", { id: pid, width: 256, height: 256, patternUnits: "userSpaceOnUse" }, defs);
        el("image", { href: deskPattern(), width: 256, height: 256 }, p);
        el("rect", { x: -3000, y: -2400, width: WORLD_W + 6000, height: WORLD_H + 4800, fill: `url(#${pid})` }, deskG);
        const rg = el("radialGradient", { id: "desklight", cx: WORLD_W / 2, cy: WORLD_H / 2, r: WORLD_W * 0.7, gradientUnits: "userSpaceOnUse" }, defs);
        el("stop", { offset: "0", "stop-color": "#5a4a36", "stop-opacity": "0.35" }, rg);
        el("stop", { offset: "1", "stop-color": "#000", "stop-opacity": "0.35" }, rg);
        el("rect", { x: -3000, y: -2400, width: WORLD_W + 6000, height: WORLD_H + 4800, fill: "url(#desklight)" }, deskG);
      }

      // trait qui se dessine : les tracés rough.js se révèlent (stroke-dashoffset), les hachures ensuite
      function draw(pg, node, t0, dur, { pen = true, off = [0, 0] } = {}) {
        let host = pg.ink;
        if (off[0] || off[1]) host = el("g", { transform: `translate(${off[0]} ${off[1]})` }, pg.ink);
        host.appendChild(node);
        const paths = [...node.querySelectorAll("path")];
        const outl = [],
          hatch = [],
          fills = [];
        paths.forEach((p, i) => {
          p.setAttribute("stroke-linecap", "round");
          p.setAttribute("stroke-linejoin", "round");
          const f = p.getAttribute("fill");
          if (f && f !== "none") {
            fills.push(p);
            p.style.opacity = "0";
            return;
          }
          const len = p.getTotalLength() + 1;
          p.style.strokeDasharray = `${len} ${len}`;
          p.style.strokeDashoffset = `${len}`;
          (i === paths.length - 1 ? outl : hatch).push({ p, len });
        });
        const split = hatch.length ? 0.62 : 1;
        const it = {
          t0,
          dur,
          update(t) {
            const u = prog(t, t0, dur);
            const uo = clamp01(u / split),
              uh = hatch.length ? clamp01((u - 0.38) / 0.62) : 0;
            for (const r of outl) r.p.style.strokeDashoffset = `${r.len * (1 - uo)}`;
            for (const r of hatch) r.p.style.strokeDashoffset = `${r.len * (1 - uh)}`;
            for (const p of fills) p.style.opacity = `${clamp01((u - 0.45) / 0.55)}`;
          },
          pointAt(t) {
            const u = prog(t, t0, dur);
            let r = outl[0] || hatch[0],
              v = clamp01(u / split);
            if (hatch.length && u > split) {
              r = hatch[0];
              v = clamp01((u - 0.38) / 0.62);
            }
            if (!r) return [pg.px + off[0], pg.py + off[1]];
            const q = r.p.getPointAtLength(Math.max(0, r.len - 1) * v);
            return [pg.px + off[0] + q.x, pg.py + off[1] + q.y];
          },
        };
        items.push(it);
        if (pen) penItems.push(it);
        return it;
      }
      // écriture manuscrite : le texte se découvre lettre par lettre derrière une découpe
      let CLIP = 0;
      function write(pg, str, x, y, size, t0, dur, { weight = 600, color = INK, anchor = "start", pen = true } = {}) {
        // texte de lecture (44 px et plus à l'échelle normale) ; il ne devient minuscule que pendant le recul final sur le carnet
        const t = el("text", { x, y, "font-family": "Caveat", "font-weight": weight, "font-size": size, fill: color, "data-layout-ignore": "" }, pg.ink);
        t.textContent = str;
        const w = t.getComputedTextLength();
        const x0 = anchor === "middle" ? x - w / 2 : anchor === "end" ? x - w : x;
        t.setAttribute("x", x0);
        const n = str.length;
        const cx = [0];
        for (let i = 1; i <= n; i++) cx.push(t.getSubStringLength(0, i));
        const id = "wc" + CLIP++;
        const cp = el("clipPath", { id }, defs);
        const rect = el("rect", { x: x0 - size * 0.35, y: y - size * 1.2, width: 0, height: size * 1.75 }, cp);
        t.setAttribute("clip-path", `url(#${id})`);
        const reveal = (u) => {
          if (u <= 0) return -1;
          if (u >= 1) return w;
          const idx = u * n,
            i = Math.min(n - 1, Math.floor(idx));
          return cx[i] + (cx[i + 1] - cx[i]) * (idx - i);
        };
        const it = {
          t0,
          dur,
          w,
          x0,
          update(tt) {
            const u = prog(tt, t0, dur);
            const xr = reveal(u);
            rect.setAttribute("width", xr < 0 ? 0 : u >= 1 ? w + size : xr + size * 0.35);
          },
          pointAt(tt) {
            const u = prog(tt, t0, dur);
            const xr = Math.max(0, reveal(u));
            return [pg.px + x0 + xr, pg.py + y - size * 0.3 + Math.sin(tt * 38) * size * 0.07];
          },
        };
        items.push(it);
        if (pen) penItems.push(it);
        return it;
      }
      // lavis : apparaît par couches, comme l'eau qui s'étale
      function wash(pg, img, t0, dur = 0.9, opacity = 0.95) {
        const cx = img.x + img.w / 2,
          cy = img.y + img.h / 2;
        const e = el("image", { href: img.url, x: img.x, y: img.y, width: img.w, height: img.h, opacity: 0 }, pg.wash);
        items.push({
          update(t) {
            const u = prog(t, t0, dur);
            const s = 0.9 + 0.1 * out3(u);
            e.setAttribute("opacity", (out3(u) * opacity).toFixed(3));
            e.setAttribute("transform", `translate(${cx} ${cy}) scale(${s.toFixed(4)}) translate(${-cx} ${-cy})`);
          },
        });
      }
      const washBlob = (pg, cx, cy, rx, ry, t0, dur, col = "#3f9a62") => wash(pg, washImage(blobShape(cx, cy, rx, ry, SEED++), { x: cx - rx * 1.15, y: cy - ry * 1.15, w: rx * 2.3, h: ry * 2.3 }, col, SEED++), t0, dur);
      // image collée (logo, coupure de la Déclaration)
      function paste(pg, href, x, y, w, h, t0, dur, rot = 0, shadow = true) {
        const g = el("g", {}, pg.ink);
        const sh = el("rect", { x: x + 8, y: y + 10, width: w, height: h, fill: shadow ? "rgba(40,30,10,0.22)" : "none", opacity: 0 }, g);
        const im = el("image", { href, x, y, width: w, height: h, opacity: 0, preserveAspectRatio: "xMidYMid slice" }, g);
        const cx = x + w / 2,
          cy = y + h / 2;
        items.push({
          update(t) {
            const u = prog(t, t0, dur);
            const s = 1.06 - 0.06 * out3(u);
            g.setAttribute("transform", `rotate(${rot} ${cx} ${cy}) translate(${cx} ${cy}) scale(${s.toFixed(4)}) translate(${-cx} ${-cy})`);
            im.setAttribute("opacity", out3(u).toFixed(3));
            sh.setAttribute("opacity", out3(u).toFixed(3));
          },
        });
        return g;
      }
      // points qui apparaissent (carte) : petit cercle d'encre et touche de vert
      function pops(pg, pts, size, tOf, { skip = -1, col = GREEN_H } = {}) {
        pts.forEach(([x, y], i) => {
          if (i === skip) return;
          const g = el("g", {}, pg.ink);
          g.appendChild(rc.circle(x, y, size, O({ strokeWidth: 1.8, roughness: 0.9, fill: col, fillStyle: "solid" })));
          g.querySelectorAll("path").forEach((p) => p.setAttribute("stroke-linecap", "round"));
          const t0 = tOf(i);
          items.push({
            update(t) {
              const u = prog(t, t0, 0.22);
              const s = u <= 0 ? 0 : outBack(u);
              g.setAttribute("opacity", u <= 0 ? 0 : 1);
              g.setAttribute("transform", `translate(${x} ${y}) scale(${Math.max(0.001, s).toFixed(4)}) translate(${-x} ${-y})`);
            },
          });
        });
      }

      // ------------------------------------------------------------------ la carte du Gabon (contour du logo, 71 points)
      const OUT = window.GABON_OUTLINE,
        DOTS = window.FEG_DOTS;
      const obx = [Math.min(...OUT.map((p) => p[0])), Math.max(...OUT.map((p) => p[0]))],
        oby = [Math.min(...OUT.map((p) => p[1])), Math.max(...OUT.map((p) => p[1]))];
      const OCX = (obx[0] + obx[1]) / 2,
        OCY = (oby[0] + oby[1]) / 2;
      const mapXY = (cx, cy, s) => (p) => [cx + (p[0] - OCX) * s, cy + (p[1] - OCY) * s];
      const LBV = 24;
      const dist = DOTS.map((d) => Math.hypot(d[0] - DOTS[LBV][0], d[1] - DOTS[LBV][1]));
      const MAXD = Math.max(...dist);

      // ------------------------------------------------------------------ le stylo plume
      const penShadow = el("g", { opacity: 0 }, penG);
      const penBody = el("g", { opacity: 0 }, penG);
      const PEN = (g, shadow) => {
        const f = shadow ? "rgba(0,0,0,1)" : null;
        el("path", { d: "M0 0 L-10 -36 L10 -36 Z", fill: f || "#c7a24a" }, g);
        if (!shadow) el("path", { d: "M0 -4 L0 -26", stroke: "#5b4a1a", "stroke-width": 1.6 }, g);
        if (!shadow) el("circle", { cx: 0, cy: -24, r: 2.2, fill: "#5b4a1a" }, g);
        el("rect", { x: -12, y: -50, width: 24, height: 14, rx: 3, fill: f || "#d7b75e" }, g);
        el("rect", { x: -14, y: -320, width: 28, height: 272, rx: 13, fill: f || "#1f3b2a" }, g);
        if (!shadow) {
          el("rect", { x: -8, y: -308, width: 5, height: 250, rx: 2.5, fill: "rgba(255,255,255,0.16)" }, g);

          {

        // ===== page 8 : au quotidien, quatre services

          draw(

          draw(p, rc.path("M534 460 L604 474 M534 488 L604 502 M534 516 L590 528", O({ strokeWidth: 2 })), tf + 0.38, 0.14);
          write(p, "des formations", 620, 768, 60, tf + 0.5, 0.46, { anchor: "middle" });
          // un réseau d'affaires : poignée de main
          {

            node.appendChild(

            node.appendChild(rc.path("M852 574 L874 604 M1108 574 L1086 604", O({ strokeWidth: 2.4 })));
            node.appendChild(rc.ellipse(980, 522, 118, 64, O({ strokeWidth: 2.8 })));
            node.appendChild(rc.path("M946 526 q10 16 0 30 M968 528 q10 18 0 32 M990 528 q10 16 0 30 M1012 524 q8 12 0 24", O({ strokeWidth: 2.2 })));
            node.appendChild(rc.path("M944 506 q22 -24 54 -8", O({ strokeWidth: 2.6 })));

          // la médiation et l'arbitrage : balance

            node.appendChild(rc.arc(1262, 506, 96, 46, 0, Math.PI, true, O(HATCH(GREEN_H, { hachureGap: 7, fillWeight: 1.3 }))));
            node.appendChild(rc.arc(1418, 506, 96, 46, 0, Math.PI, true, O(HATCH(GREEN_H, { hachureGap: 7, fillWeight: 1.3 }))));

          write(p, "la médiation", 1340, 768, 60, tm + 0.52, 0.44, { anchor: "middle" });
          write(p, "et l'arbitrage", 1340, 836, 60, at("L09", "larbitrage") + 0.02, 0.5, { anchor: "middle" });
        }

        // ===== page 9 : des entreprises fortes ; votre entreprise a sa place à nos côtés
        {
          const p = pages[9];
          write(p, "Des entreprises fortes,", 130, 236, 96, at("L10", "Des") - 0.02, 0.98, { weight: 700 });
          write(p, "une prospérité partagée.", 130, 352, 96, at("L10", "une") - 0.04, 0.95, { weight: 700 });
          const MP = mapXY(1250, 640, 0.95);
          const outline = OUT.map(MP);

          draw(p, rc.polygon(outline, O({ roughness: 0.8, strokeWidth: 2.8 })), tM, 0.6, { pen: true });
          wash(p, washImage(polyShape(outline), { x: 1020, y: 420, w: 460, h: 440 }, "#3f9a62", 911), tM + 0.2, 0.8, 0.9);
          const PLACE = 33;
          pops(p, DOTS.map(MP), 15, (i) => tM + 0.3 + (dist[i] / MAXD) * 0.5, { skip: PLACE });
          const tV = at("L10", "Votre");
          write(p, "Votre entreprise", 130, 566, 108, tV - 0.04, 0.72, { weight: 700, color: GREEN });

          const wC = write(p, "à nos côtés.", 130, 826, 108, at("L10", "nos") - 0.22, 0.58, { weight: 700, color: GREEN });

          draw(

      }

      // ------------------------------------------------------------------ caméra : de page en page, puis recul sur le carnet
      const MOVES = [
        [9.35, 1],
        [14.45, 2],
        [24.05, 3],
        [31.15, 4],
        [35.85, 5],
        [41.65, 6],
        [51.25, 7],
        [59.95, 8],
        [68.55, 9],
      ];
      const MOVE_DUR = 0.9;
      const T_BACK = at("L10", "rejoignez") - 0.1,
        BACK_DUR = 2.35;
      function camAt(t) {
        let [x, y] = pageCenter(0);
        let z = 1.1,
          dip = 0,
          kPrev = 0,
          tArrive = 0;
        for (let i = 0; i < MOVES.length; i++) {
          const [tm, k] = MOVES[i];
          if (t < tm) break;
          const s = prog(t, tm, MOVE_DUR),
            e = inOut(s);
          const a = pageCenter(kPrev),
            b = pageCenter(k);
          x = lerp(a[0], b[0], e);
          y = lerp(a[1], b[1], e);
          dip = Math.sin(Math.PI * s) * 0.13;
          kPrev = k;
          tArrive = tm + MOVE_DUR;
        }
        // lente avancée sur chaque page
        const nextMove = (MOVES.find((m) => m[0] > t) || [T_BACK])[0];
        z = (1.1 + 0.035 * inOut(prog(t, tArrive, Math.max(1, nextMove - tArrive)))) * (1 - dip);
        // recul final
        const sb = prog(t, T_BACK, BACK_DUR),
          eb = inOut(sb);
        if (sb > 0) {
          x = lerp(x, WORLD_W / 2, eb);
          y = lerp(y, WORLD_H / 2, eb);
          z = Math.exp(lerp(Math.log(z), Math.log(0.2), eb));
        }
        return { x, y, z, hand: 1 - eb };
      }

      // ------------------------------------------------------------------ le stylo suit le trait en cours
      function penAt(t) {
        let act = null;
        for (const it of penItems) if (t >= it.t0 && t <= it.t0 + it.dur && (!act || it.t0 >= act.t0)) act = it;
        if (act) return { p: act.pointAt(t), lift: 0 };
        let prev = null,
          next = null;
        for (const it of penItems) {
          const e = it.t0 + it.dur;
          if (e < t && (!prev || e > prev.t0 + prev.dur)) prev = it;
          if (it.t0 > t && (!next || it.t0 < next.t0)) next = it;
        }
        if (!prev && next) {
          const b = next.pointAt(next.t0);
          const s = inOut(prog(t, 0, next.t0));
          return { p: [lerp(b[0] + 900, b[0], s), lerp(b[1] + 700, b[1], s)], lift: 1 - s };
        }
        if (prev && next) {
          const a = prev.pointAt(prev.t0 + prev.dur),
            b = next.pointAt(next.t0);
          const t1 = prev.t0 + prev.dur;
          const s = prog(t, t1, next.t0 - t1),
            e = inOut(s);
          const lift = Math.sin(Math.PI * s) * Math.min(1, (next.t0 - t1) / 0.6);
          return { p: [lerp(a[0], b[0], e) + lift * 26, lerp(a[1], b[1], e) - lift * 46], lift };
        }
        if (prev) {
          const a = prev.pointAt(prev.t0 + prev.dur);
          const s = inOut(prog(t, prev.t0 + prev.dur, 0.9));
          return { p: [a[0] + s * 160, a[1] + s * 90], lift: s };
        }
        return { p: [0, 0], lift: 1 };
      }

      // ------------------------------------------------------------------ une image
      function render(t) {
        const c = camAt(t);
        const hx = Math.sin(t * 0.41) * 5 * c.hand,
          hy = Math.sin(t * 0.33 + 1) * 4 * c.hand,
          hr = Math.sin(t * 0.27) * 0.22 * c.hand;
        camG.setAttribute("transform", `translate(${(960 + hx).toFixed(2)} ${(540 + hy).toFixed(2)}) rotate(${hr.toFixed(3)}) scale(${c.z.toFixed(5)}) translate(${(-c.x).toFixed(2)} ${(-c.y).toFixed(2)})`);
        for (const it of items) it.update(t);
        // stylo
        const pa = penAt(t);
        const vis = out3(prog(t, 0.05, 0.4)) * (1 - out3(prog(t, T_BACK - 0.1, 0.5)));
        const [px, py] = pa.p;
        const lift = pa.lift;
        penBody.setAttribute("opacity", vis.toFixed(3));
        penShadow.setAttribute("opacity", (vis * (0.2 - 0.08 * lift)).toFixed(3));
        penBody.setAttribute("transform", `translate(${px.toFixed(1)} ${py.toFixed(1)}) rotate(${PEN_ANGLE})`);
        penShadow.setAttribute("transform", `translate(${(px + 18 + lift * 40).toFixed(1)} ${(py + 14 + lift * 30).toFixed(1)}) rotate(${PEN_ANGLE})`);
      }

      (async function init() {
        await Promise.all([document.fonts.load('600 60px "Caveat"'), document.fonts.load('700 60px "Caveat"')]).catch(() => {});
        await build();
        host.render = render;
        render(host.clock.t);
        host.ready();
      })();
    </script>
