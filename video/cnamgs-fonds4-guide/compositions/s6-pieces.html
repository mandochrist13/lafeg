  <script>
    (function () {
      var C = window.__CN_CUES;
      var P = window.CNP;
      var L = C.local("s6");
      var D = C.sc.s6.dur;
      document.getElementById("s6-cover").innerHTML = P.folderTop(400, 560);
      // la main d'Awa, à plat, pousse chaque pièce à sa place
      var R = -18,
        SC = 0.85;
      document.getElementById("s6-hand").innerHTML = P.armTop("s6arm", { pose: "flat", hand: "R", s: SC, r: R, skin: "#6E4429", top: "#5AA137", shirt: "#5AA137" });
      function off(px, py) {
        var a = (R * Math.PI) / 180;
        return { x: SC * (px * Math.cos(a) - py * Math.sin(a)), y: SC * (px * Math.sin(a) + py * Math.cos(a)) };
      }
      var palmO = off(0, -398);
      function palmAt(x, y) {
        return { x: x - palmO.x, y: y - palmO.y };
      }
      var PARK = { x: 1760, y: 1330 },
        park = palmAt(PARK.x, PARK.y);
      gsap.set("#s6arm", { x: park.x, y: park.y });

      var tl = gsap.timeline({ paused: true });
      // la chemise fermée arrive, puis s'ouvre sur « Apportez »
      gsap.set("#s6-inside", { scaleX: 0, transformOrigin: "100% 50%" });
      gsap.set("#s6-cover", { transformOrigin: "0% 50%" });
      tl.fromTo("#s6-desk", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 0.0);
      tl.fromTo("#s6-folder", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.05);
      var tOpen = L(C.at("L07", ["apportez"])) + 0.05;
      tl.to("#s6-cover", { scaleX: 0, duration: 0.22, ease: "power2.in" }, tOpen)
        .set("#s6-cover", { opacity: 0 }, tOpen + 0.22)
        .to("#s6-inside", { scaleX: 1, duration: 0.26, ease: "power2.out" }, tOpen + 0.22);
      tl.fromTo(".s6-bar3", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, 0.1);
      tl.fromTo("#s6-kick", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" }, 0.2);

      // pièces : [doc, ligne de la liste, mot, centre de pose (écran), point d'appui de la paume (décalage)]
      var docs = [
        { d: "#s6-d0", i: "#s6-i0", line: "L07", w: "acte", cx: 1612, cy: 550, rot: -1.5, pal: [30, 150] },
        { d: "#s6-d1", i: "#s6-i1", line: "L07", w: "piece", cx: 1212, cy: 437, rot: -4, pal: [40, 50] },
        { d: "#s6-d2", i: "#s6-i2", line: "L07", w: "avis", cx: 1615, cy: 544, rot: 1.5, pal: [30, 150] },
        { d: "#s6-d3", i: "#s6-i3", line: "L07", w: "fiche", cx: 1609, cy: 548, rot: -1, pal: [30, 150] },
        { d: "#s6-d4", i: "#s6-i4", line: "L08", w: "copie", say: "ajoutez", cx: 1617, cy: 542, rot: 2, pal: [30, 150] },
        { d: "#s6-d5", i: "#s6-i5", line: "L08", w: "carte", say: "etranger", cx: 1216, cy: 681, rot: 3, pal: [40, 50] },
      ];
      docs.forEach(function (o, k) {
        var tw = L(C.at(o.line, [o.w])),
          tIn = tw - 0.6,
          tLand = tw - 0.05;
        var target = { x: o.cx + o.pal[0], y: o.cy + o.pal[1] };
        var a = palmAt(target.x, target.y);
        var dx = PARK.x - target.x,
          dy = PARK.y - target.y;
        // la feuille part de sous la main (hors champ) et arrive avec elle
        gsap.set(o.d, { x: dx, y: dy, rotation: o.rot + 10, opacity: 0 });
        tl.set(o.d, { opacity: 1 }, tIn);
        tl.to(o.d, { x: 0, y: 0, rotation: o.rot, duration: 0.55, ease: "power3.out" }, tIn);
        tl.to("#s6arm", { x: a.x, y: a.y, duration: 0.55, ease: "power3.out" }, tIn);
        tl.to("#s6arm-arm", { scale: 0.97, duration: 0.1, ease: "power2.out", yoyo: true, repeat: 1, transformOrigin: "0px -398px" }, tLand);
        tl.to("#s6arm", { x: park.x, y: park.y, duration: 0.45, ease: "power2.in" }, tLand + 0.3);
        // la ligne de la liste apparaît avec la pièce, puis se coche quand elle est posée
        var tItem = o.say ? Math.min(tIn + 0.15, L(C.at(o.line, [o.say])) - 0.1) : tIn + 0.15;
        tl.fromTo(o.i, { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" }, tItem);
        tl.fromTo(o.i + " .fill", { scale: 0, transformOrigin: "22px 22px" }, { scale: 1, duration: 0.3, ease: "back.out(2)" }, tLand + 0.05);
        tl.fromTo(o.i + " .tick", { strokeDasharray: 32, strokeDashoffset: 32 }, { strokeDashoffset: 0, duration: 0.25, ease: "power1.inOut" }, tLand + 0.2);
      });
      // « légalisé » : le cachet
      var tLeg = L(C.at("L07", ["legalise"])) + 0.12;
      tl.fromTo("#s6-stamp", { opacity: 0, scale: 1.5, transformOrigin: "222px 392px" }, { opacity: 0.92, scale: 1, duration: 0.14, ease: "power4.in" }, tLeg);
      // « Si vous êtes marié… » : les pièces selon la situation
      tl.fromTo("#s6-sit", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" }, L(C.at("L08", ["si"])) - 0.1);

      tl.to(["#s6-kick", ".s6-bar3", ".s6-it", "#s6-sit"], { opacity: 0, filter: "blur(6px)", duration: 0.32, ease: "power3.in" }, D - 0.36);
      tl.to(["#s6-folder", "#s6-desk"], { opacity: 0, duration: 0.32, ease: "power2.in" }, D - 0.34);
      window.__timelines["s6"] = tl;
    })();
  </script>
