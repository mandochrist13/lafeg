  <script>
    (function () {
      var C = window.__CN_CUES;
      var P = window.CNP;
      var K = window.CAST;
      var L = C.local("s1");
      var D = C.sc.s1.dur;

      // décors répétitifs : auvent rayé, trous du panneau à outils, livres
      var aw = "";
      for (var i = 0; i < 12; i++) {
        var col = i % 2 ? "#FFFFFF" : "#5AA137";
        aw += '<rect x="' + i * 46 + '" y="0" width="46" height="54" fill="' + col + '"/><circle cx="' + (i * 46 + 23) + '" cy="54" r="23" fill="' + col + '"/>';
      }
      document.getElementById("s1-awning").innerHTML = aw;
      var holes = "";
      for (var hy = 0; hy < 8; hy++) for (var hx = 0; hx < 19; hx++) holes += '<circle cx="' + (52 + hx * 24) + '" cy="' + (54 + hy * 24) + '" r="3"/>';
      document.getElementById("s1-holes").innerHTML = holes;
      var bookCols = ["#0066A8", "#084E86", "#5AA137", "#F7D21E", "#BDBDBD", "#3F8526", "#5B6573", "#C9A227"];
      var books = "";
      [[104, 0], [180, 3], [258, 5]].forEach(function (sh) {
        var x = 44,
          k = sh[1];
        while (x < 500) {
          var w = 14 + ((k * 7) % 4) * 3,
            h = 50 + ((k * 5) % 5) * 4;
          books += '<rect x="' + x + '" y="' + (sh[0] - h) + '" width="' + w + '" height="' + h + '" rx="2" fill="' + bookCols[k % bookCols.length] + '"/>';
          x += w + 3;
          k++;
        }
      });
      document.getElementById("s1-books").innerHTML = books;

      // les six travailleurs, en buste derrière leur comptoir (repère du panneau 548 × 368)
      var who = [
        { id: "a1", name: "awa", x: 300, y: 412 },
        { id: "a2", name: "moussa", x: 276, y: 420 },
        { id: "a3", name: "avocat", x: 266, y: 424 },
        { id: "a4", name: "infirmiere", x: 280, y: 428 },
        { id: "a5", name: "chauffeur", x: 300, y: 440 },
        { id: "a6", name: "jardinier", x: 290, y: 436 },
      ];
      who.forEach(function (w, i) {
        document.getElementById("s1-w" + i).innerHTML = P.front(w.id, K.with(w.name, { x: w.x, y: w.y, s: 0.92 }));
        P.prep(w.id);
        gsap.set("#" + w.id + "-uaL", { rotation: 4 });
        gsap.set("#" + w.id + "-uaR", { rotation: -4 });
      });

      var tl = gsap.timeline({ paused: true });
      // la question, d'abord seule au centre, puis en tête de la grille
      // (visible dès la première image : c'est la vignette du film ; lente poussée jusqu'à la question de la voix)
      var tUp = L(C.at("L01", ["commercant"])) - 0.55;
      tl.fromTo("#s1-q", { y: 420, scale: 1.38, transformOrigin: "50% 50%" }, { y: 420, scale: 1.5, duration: tUp, ease: "none" }, 0);
      tl.fromTo("#s1-qbar", { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power3.out" }, 0.2);
      tl.to("#s1-q", { y: 0, scale: 1, duration: 0.6, ease: "power3.inOut" }, tUp);
      tl.to("#s1-qbar", { opacity: 0, duration: 0.3, ease: "power2.in" }, tUp);

      // chaque métier entre sur son mot
      var words = ["commercant", "artisan", "avocat", "infirmiere", "chauffeur", "jardinier"];
      words.forEach(function (wd, i) {
        var t = L(C.at("L01", [wd])) - 0.14;
        tl.fromTo("#s1-p" + i, { opacity: 0, y: 36, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "power3.out" }, t);
        tl.fromTo("#s1-w" + i, { y: 46 }, { y: 0, duration: 0.6, ease: "power3.out" }, t + 0.05);
        tl.fromTo("#s1-l" + i, { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" }, t + 0.3);
        var id = who[i].id;
        tl.fromTo("#" + id + "-head", { rotation: i % 2 ? 4 : -4 }, { rotation: 0, duration: 0.7, ease: "power2.out" }, t + 0.2);
        tl.to("#" + id + "-mouth", { scaleX: 1.12, scaleY: 1.35, duration: 0.3, ease: "power2.out" }, t + 0.35);
        P.breathe(tl, id, t, D, 3.1 + 0.2 * i, 0.009);
        P.blink(tl, id, [t + 1.4 + 0.3 * (i % 3), t + 3.6 + 0.2 * i]);
      });

      // « le Fonds 4 de la CNAMGS est fait pour vous » : la grille s'efface, le titre prend la place
      var tT = L(C.at("L01", ["fonds"])) - 0.3;
      tl.to("#s1-q", { opacity: 0, filter: "blur(8px)", duration: 0.3, ease: "power3.in" }, tT - 0.35);
      tl.to(".s1-pan", { opacity: 0, scale: 0.92, y: 24, filter: "blur(4px)", duration: 0.36, stagger: 0.035, ease: "power3.in" }, tT - 0.36);
