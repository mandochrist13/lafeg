<!doctype html>
<!--
  FEG — « Ceux qui font l'économie du pays ». Collage photo : une grande table de papier kraft, plus large que le cadre.
  La caméra la parcourt d'une zone à l'autre ; papiers déchirés, photos, étiquettes, post-it et rubans arrivent
  comme en animation image par image (poses à 12 im/s), se posent, se font scotcher, tamponner, annoter.
  Tout ce qui est visible est render(t), fonction pure du temps (horloge GSAP) ; temps : assets/cues.js.
-->
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>FEG — Ceux qui font l'économie du pays</title>
    <style>
      @font-face {
        font-family: "Hyundai Sans Head";
        font-weight: 500;
        src: url("assets/fonts/HyundaiSansHead-Medium.woff2") format("woff2");
      }
      @font-face {
        font-family: "Hyundai Sans Head";
        font-weight: 700;
        src: url("assets/fonts/HyundaiSansHead-Bold.woff2") format("woff2");
      }
      @font-face {
        font-family: "Caveat";
        font-weight: 700;
        src: url("assets/fonts/caveat-latin-700-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Caveat";
        font-weight: 600;
        src: url("assets/fonts/caveat-latin-600-normal.woff2") format("woff2");
      }
      #world-root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #e8dcc2;
      }
      #world-cv {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        display: block;
      }
    </style>
  </head>
  <body>
    <div
      id="world-root"
      data-composition-id="world"
      data-start="0"
      data-duration="86.731"
      data-total
      data-width="1920"
      data-height="1080"
      data-layout-allow-overlap
    >
      <canvas
        id="world-cv"
        class="clip"
        width="1920"
        height="1080"
        data-start="0"
        data-duration="86.731"
        data-total
        data-track-index="0"
        data-layout-allow-overflow
      ></canvas>
    </div>

    <script>
      (function () {
        var C = window.__FL_CUES;
        var total = C ? C.total : 86.731;
        var host = { clock: { t: 0 }, render: null };
        window.__worldHost = host;
        window.__hf = window.__hf || {};
        window.__hf.buildReady = window.__hf.buildReady || {};
        window.__hf.buildReady["world"] = new Promise(function (resolve) {
          host.ready = resolve;
        });
        var tl = gsap.timeline({ paused: true });
        tl.to(host.clock, {
          t: total,
          duration: total,
          ease: "none",
          onUpdate: function () {
            if (host.render) host.render(host.clock.t);
          },
        });
        window.__timelines = window.__timelines || {};
        window.__timelines["world"] = tl;
      })();
    </script>
    <script src="assets/geo.js"></script>
    <script>
      (async function () {
        const host = window.__worldHost;
        const C = window.__FL_CUES;
        const at = (id, w) => C.at(id, w);
        const atLast = (id, w) => {
          const n = w.toLowerCase();
          const ws = C.lines[id].words.filter((x) => x.n === n);
          return ws.length ? ws[ws.length - 1].s : C.lines[id].start;
        };

        // ------------------------------------------------------------ outils
        const clamp01 = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
        const lerp = (a, b, u) => a + (b - a) * u;
        const out3 = (u) => 1 - Math.pow(1 - clamp01(u), 3);
        const in2 = (u) => clamp01(u) * clamp01(u);
        const inOut = (u) => ((u = clamp01(u)), u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
        function mulberry32(a) {
          return function () {
            a |= 0;
            a = (a + 0x6d2b79f5) | 0;
            let r = Math.imul(a ^ (a >>> 15), 1 | a);
            r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
            return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
          };
        }
        const rnd = mulberry32(1959);
        const hash = (n) => {
          n = (n ^ 61) ^ (n >>> 16);
          n = n + (n << 3);
          n = n ^ (n >>> 4);
          n = Math.imul(n, 0x27d4eb2d);
          n = n ^ (n >>> 15);
          return (n >>> 0) / 4294967296;
        };
        const FPS = 12; // cadence des poses (animation image par image)
        const Q = (t) => Math.floor(t * FPS + 1e-6) / FPS;

        const GREEN = "#0b5a33",
          DEEP = "#063d21",
          BRONZE = "#b3ae78",
          INK = "#1d2a22",
          MARKER = "#0d6b3c",
          RED = "#7d2a1f",
          PAPER = "#fbf8f0",
          MANILA = "#ead9ad",
          WOOL = "#b4322a";

        await Promise.all([
          document.fonts.load('700 90px "Hyundai Sans Head"'),
          document.fonts.load('500 40px "Hyundai Sans Head"'),
          document.fonts.load("700 60px Caveat"),
          document.fonts.load("600 40px Caveat"),
        ]).catch(() => {});
        const load = (src) =>
          new Promise((res) => {
            const i = new Image();
            i.onload = () => res(i);
            i.onerror = () => res(null);
            i.src = src;
          });
        const [IMG_SIEGE, IMG_FORM, IMG_MAINS, IMG_SALLE, IMG_DECL, IMG_LOGO, IMG_GEF] = await Promise.all(
          ["assets/img/siege.jpg", "assets/img/formation.jpg", "assets/img/mains.jpg", "assets/img/salle.jpg", "assets/img/declaration-p1.jpg", "assets/img/feg-logo.png", "assets/img/gef-logo.png"].map(load),
        );

        // ------------------------------------------------------------ fabrique de papiers (rendus une fois)
        const SS = 1.5; // pixels de sprite par unité de table
        function mk(w, h) {
          const c = document.createElement("canvas");
          c.width = Math.ceil(w * SS);
          c.height = Math.ceil(h * SS);
          const x = c.getContext("2d");
          x.scale(SS, SS);
          return [c, x];
        }
        function tornPath(pts, amp = 3, step = 5) {
          const out = [];
          for (let i = 0; i < pts.length; i++) {
            const [x0, y0] = pts[i],
              [x1, y1] = pts[(i + 1) % pts.length];
            const L = Math.hypot(x1 - x0, y1 - y0),
              n = Math.max(1, Math.floor(L / step));
            const nx = -(y1 - y0) / L,
              ny = (x1 - x0) / L;
            for (let k = 0; k < n; k++) {
              const u = k / n,
                j = (rnd() - 0.5) * 2 * amp + Math.sin(u * 9 + i) * amp * 0.4;
              out.push([x0 + (x1 - x0) * u + nx * j, y0 + (y1 - y0) * u + ny * j]);
            }
          }
          return out;
        }
        const rectPts = (x, y, w, h) => [
          [x, y],
          [x + w, y],
          [x + w, y + h],
          [x, y + h],
        ];
        function pathFrom(c, pts) {
          c.beginPath();
          pts.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y)));
          c.closePath();
        }
        function grain(c, x, y, w, h, a = 0.07, dens = 70) {
          for (let k = 0; k < (w * h) / dens; k++) {
            c.fillStyle = rnd() < 0.5 ? `rgba(255,255,255,${a})` : `rgba(60,40,10,${a})`;
            c.fillRect(x + rnd() * w, y + rnd() * h, 0.8 + rnd() * 1.2, 0.8 + rnd() * 1.2);
          }
        }
        // ombre : silhouette floutée, à demi-résolution
        function withShadow(spr) {
          const s = 0.5,
            PAD = 22;
          const c = document.createElement("canvas");
          c.width = Math.ceil(spr.cv.width * s) + 2 * PAD;
          c.height = Math.ceil(spr.cv.height * s) + 2 * PAD;
          const x = c.getContext("2d");
          x.filter = "blur(6px)";
          x.drawImage(spr.cv, PAD, PAD, spr.cv.width * s, spr.cv.height * s);
          x.filter = "none";
          x.globalCompositeOperation = "source-in";
          x.fillStyle = "rgb(45,30,10)";
          x.fillRect(0, 0, c.width, c.height);
          spr.sh = c;
          spr.shPad = PAD / s / SS;
          return spr;
        }
        // bande de papier avec un texte (titres)
        function strip(text, size, bg, fg, o = {}) {
          const font = `${o.weight || 700} ${size}px "${o.family || "Hyundai Sans Head"}"`;
          const m = document.createElement("canvas").getContext("2d");
          m.font = font;
          const tw = m.measureText(text).width;
          const padX = o.padX ?? size * 0.34,
            padY = o.padY ?? size * 0.17;
          const w = tw + 2 * padX + 12,
            h = size * 1.1 + 2 * padY + 12;
          const [cv, c] = mk(w, h);
          c.fillStyle = bg;
          pathFrom(c, tornPath(rectPts(6, 6, w - 12, h - 12), 2.0, 5));
          c.fill();
          c.save();
          c.clip();
          grain(c, 0, 0, w, h, 0.06);
          c.restore();
          c.fillStyle = fg;
          c.font = font;
          c.textBaseline = "middle";
          c.textAlign = "center";
          c.fillText(text, w / 2, h / 2 + size * 0.04);
          return withShadow({ cv, w, h });
        }
        // écriture manuscrite (révélée de gauche à droite)
        function hand(text, size, color = MARKER, weight = 700) {
          const font = `${weight} ${size}px Caveat`;
          const m = document.createElement("canvas").getContext("2d");
          m.font = font;
          const w = m.measureText(text).width + 16,
            h = size * 1.25;
          const [cv, c] = mk(w, h);
          c.fillStyle = color;
          c.font = font;
          c.textBaseline = "middle";
          c.fillText(text, 8, h / 2);
          return { cv, w, h, noShadow: true };
        }
        // photo découpée : papier blanc, photo recadrée
        function photo(img, w, h, o = {}) {
          const b = o.border ?? 12,
            bot = o.bottom ?? b;
          const W = w + 2 * b + 12,
            H = h + b + bot + 12;
          const [cv, c] = mk(W, H);
          c.fillStyle = PAPER;
          pathFrom(c, o.clean ? rectPts(6, 6, W - 12, H - 12) : tornPath(rectPts(6, 6, W - 12, H - 12), 2.4, 5));
          c.fill();
          c.save();
          pathFrom(c, o.clean ? rectPts(6 + b, 6 + b, w, h) : tornPath(rectPts(6 + b, 6 + b, w, h), 1.3, 6));
          c.clip();
          if (img) {
            const ar = img.width / img.height,
              tr = w / h;
            let sw = img.width,
              sh = img.height,
              sx = 0,
              sy = 0;
            if (ar > tr) {
              sw = img.height * tr;
              sx = (img.width - sw) * (o.fx ?? 0.5);
            } else {
              sh = img.width / tr;
              sy = (img.height - sh) * (o.fy ?? 0.5);
            }
            c.drawImage(img, sx, sy, sw, sh, 6 + b, 6 + b, w, h);
          }
          c.fillStyle = "rgba(240, 225, 190, 0.1)";
          c.fillRect(6 + b, 6 + b, w, h);
          c.restore();
          if (o.caption) {
            c.fillStyle = INK;
            c.font = "600 34px Caveat";
            c.textAlign = "center";
            c.textBaseline = "middle";
            c.fillText(o.caption, W / 2, 6 + b + h + bot / 2 + 2);
          }
          return withShadow({ cv, w: W, h: H });
        }
        // découpage : formes colorées + liseré blanc découpé aux ciseaux
        function cutout(draw, w, h, border = 11) {
          const M = border + 8;
          const W = w + 2 * M,
            H = h + 2 * M;
          const [sc, s] = mk(W, H);
          s.translate(M, M);
          draw(s);
          const [cv, c] = mk(W, H);
          const k = 24;
          for (let i = 0; i < k; i++) {
            const a = (i / k) * Math.PI * 2;
            c.drawImage(sc, Math.cos(a) * border, Math.sin(a) * border, W, H);
          }
          c.globalCompositeOperation = "source-in";
          c.fillStyle = PAPER;
          c.fillRect(0, 0, W, H);
          c.globalCompositeOperation = "source-over";
          c.drawImage(sc, 0, 0, W, H);
          return withShadow({ cv, w: W, h: H });
        }
        const P = (c, col, f) => {
          c.fillStyle = col;
          c.beginPath();
          f();
          c.fill();
        };
        // étiquette de fédération, épinglée
        function tag(name, count) {
          const m = document.createElement("canvas").getContext("2d");
          m.font = '500 34px "Hyundai Sans Head"';
          const w1 = m.measureText(name).width;
          m.font = '700 36px "Hyundai Sans Head"';
          const w2 = m.measureText(String(count)).width;
          const w = w1 + w2 + 26 + 2 * 26 + 12,
            h = 104;
          const [cv, c] = mk(w, h);
          c.fillStyle = MANILA;
          pathFrom(c, tornPath(rectPts(6, 14, w - 12, h - 20), 1.6, 5));
          c.fill();
          c.save();
          c.clip();
          grain(c, 0, 0, w, h, 0.07);
          c.restore();
          c.textBaseline = "middle";
          c.fillStyle = INK;
          c.font = '500 34px "Hyundai Sans Head"';
          c.fillText(name, 6 + 26, h / 2 + 6);
          c.fillStyle = GREEN;
          c.font = '700 36px "Hyundai Sans Head"';
          c.fillText(String(count), 6 + 26 + w1 + 26, h / 2 + 6);
          pin(c, w / 2, 16);
          return withShadow({ cv, w, h, pinY: 16 - h / 2 });
        }
        function pin(c, x, y, col = "#c0392b") {
          c.fillStyle = "rgba(40,25,10,0.3)";
          c.beginPath();
          c.ellipse(x + 5, y + 6, 12, 9, 0, 0, Math.PI * 2);
          c.fill();
          const g = c.createRadialGradient(x - 4, y - 4, 1, x, y, 13);
          g.addColorStop(0, "#f07a6a");
          g.addColorStop(1, col);
          c.fillStyle = g;
          c.beginPath();
          c.arc(x, y, 12, 0, Math.PI * 2);
          c.fill();
        }
        function card(text, size, o = {}) {
          const m = document.createElement("canvas").getContext("2d");
          m.font = `700 ${size}px "Hyundai Sans Head"`;
          const tw = m.measureText(text).width;
          const icon = o.icon ? 110 : 0;
          const w = tw + icon + 2 * 40 + 12,
            h = o.h || 170;
          const [cv, c] = mk(w, h);
          c.fillStyle = o.bg || PAPER;
          pathFrom(c, tornPath(rectPts(6, 10, w - 12, h - 16), 1.8, 5));
          c.fill();
          c.save();
          c.clip();
          grain(c, 0, 0, w, h, 0.05);
          c.restore();
          if (o.icon) o.icon(c, 46, h / 2);
          c.fillStyle = o.fg || DEEP;
          c.font = `700 ${size}px "Hyundai Sans Head"`;
          c.textBaseline = "middle";
          c.fillText(text, 6 + 40 + icon, h / 2 + 6);
          pin(c, w / 2, 20, o.pin);
          return withShadow({ cv, w, h, pinY: 20 - h / 2 });
        }
        function postit(text, col) {
          const S = 330;
          const [cv, c] = mk(S + 12, S + 12);
          const g = c.createLinearGradient(0, 0, 0, S);
          g.addColorStop(0, col);
          g.addColorStop(1, shade(col, -0.08));
          c.fillStyle = g;
          c.beginPath();
          c.moveTo(6, 6);
          c.lineTo(S + 6, 6);
          c.lineTo(S + 6, S - 10);
          c.quadraticCurveTo(S - 20, S + 4, S - 60, S + 6);
          c.lineTo(6, S + 6);
          c.closePath();
          c.fill();
          c.save();
          c.clip();
          grain(c, 0, 0, S + 12, S + 12, 0.05);
          c.fillStyle = "rgba(0,0,0,0.05)";
          c.fillRect(6, 6, S, 34);
          c.restore();
          c.fillStyle = INK;
          c.font = "700 58px Caveat";
          c.textAlign = "center";
          c.textBaseline = "middle";
          const lines = wrap(c, text, S - 60);
          lines.forEach((l, i) => c.fillText(l, S / 2 + 6, S / 2 + 10 + (i - (lines.length - 1) / 2) * 60));
          return withShadow({ cv, w: S + 12, h: S + 12 });
        }
        function wrap(c, text, maxW) {
          const words = text.split(" "),
            lines = [];
          let cur = "";
          for (const w of words) {
            const t = cur ? cur + " " + w : w;
            if (c.measureText(t).width > maxW && cur) {
              lines.push(cur);
              cur = w;
            } else cur = t;
          }
          if (cur) lines.push(cur);
          return lines;
        }
        function shade(hex, k) {
          const n = parseInt(hex.slice(1), 16);
          const f = (v) => Math.max(0, Math.min(255, Math.round(v * (1 + k))));
          return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
        }
        // ruban adhésif, avec ou sans texte au feutre
        function tape(text, o = {}) {
          let w = o.w || 160;
          const h = o.h || (text ? 86 : 42);
          if (text) {
            const m = document.createElement("canvas").getContext("2d");
            m.font = "700 56px Caveat";
            w = m.measureText(text).width + 70;
          }
          const [cv, c] = mk(w + 12, h + 12);
          c.fillStyle = o.col || "rgba(238, 226, 192, 0.93)";
          const pts = [];
          const n = 9;
          for (let i = 0; i <= n; i++) pts.push([6 + (i % 2 ? 5 : 0) + rnd() * 2, 6 + (i / n) * h]);
          const right = [];
          for (let i = n; i >= 0; i--) right.push([6 + w - (i % 2 ? 5 : 0) - rnd() * 2, 6 + (i / n) * h]);
          pathFrom(c, [...pts, ...right]);
          c.fill();
          c.save();
          c.clip();
          grain(c, 0, 0, w + 12, h + 12, 0.05);
          c.restore();
          if (text) {
            c.fillStyle = INK;
            c.font = "700 56px Caveat";
            c.textAlign = "center";
            c.textBaseline = "middle";
            c.fillText(text, (w + 12) / 2, (h + 12) / 2 + 3);
          }
          return withShadow({ cv, w: w + 12, h: h + 12, light: true });
        }
        // tampons encreurs
        function stampRound(top, big) {
          const S = 220;
          const [cv, c] = mk(S, S);
          c.translate(S / 2, S / 2);
          c.strokeStyle = RED;
          c.fillStyle = RED;
          c.lineWidth = 6;
          c.beginPath();
          c.arc(0, 0, 96, 0, Math.PI * 2);
          c.stroke();
          c.lineWidth = 2.5;
          c.beginPath();
          c.arc(0, 0, 82, 0, Math.PI * 2);
          c.stroke();
          c.textAlign = "center";
          c.font = '700 28px "Hyundai Sans Head"';
          c.fillText(top, 0, -20);
          c.font = '700 62px "Hyundai Sans Head"';
          c.fillText(big, 0, 40);
          scratch(c, 100);
          return { cv, w: S, h: S, noShadow: true, alpha: 0.86 };
        }
        function stampRect(text) {
          const m = document.createElement("canvas").getContext("2d");
          m.font = '700 60px "Hyundai Sans Head"';
          const w = m.measureText(text).width + 70,
            h = 110;
          const [cv, c] = mk(w, h);
          c.strokeStyle = RED;
          c.fillStyle = RED;
          c.lineWidth = 6;
          c.strokeRect(8, 8, w - 16, h - 16);
          c.font = '700 60px "Hyundai Sans Head"';
          c.textAlign = "center";
          c.textBaseline = "middle";
          c.fillText(text, w / 2, h / 2 + 3);
          c.translate(w / 2, h / 2);
          scratch(c, Math.max(w, h) / 2);
          return { cv, w, h, noShadow: true, alpha: 0.86 };
        }
        function scratch(c, R) {
          c.globalCompositeOperation = "destination-out";
          for (let k = 0; k < 600; k++) {
            const a = rnd() * Math.PI * 2,
              r = rnd() * R;
            c.fillStyle = `rgba(0,0,0,${0.25 + rnd() * 0.6})`;
            c.beginPath();
            c.arc(Math.cos(a) * r, Math.sin(a) * r, 0.6 + rnd() * 2.2, 0, Math.PI * 2);
            c.fill();
          }
          c.globalCompositeOperation = "source-over";
        }
        function disc(r) {
          const S = 2 * r + 16;
          const [cv, c] = mk(S, S);
          const pts = [];
          for (let i = 0; i < 90; i++) {
            const a = (i / 90) * Math.PI * 2;
            pts.push([S / 2 + Math.cos(a) * r, S / 2 + Math.sin(a) * r]);
          }
          c.fillStyle = PAPER;
          pathFrom(c, tornPath(pts, 1.8, 6));
          c.fill();
          c.save();
          c.clip();
          grain(c, 0, 0, S, S, 0.05);
          c.restore();
          return withShadow({ cv, w: S, h: S });
        }
        function bubble(text, size, bg, fg, w, h, tailLeft = true) {
          const W = w + 40,
            H = h + 70;
          const [cv, c] = mk(W, H);
          c.fillStyle = bg;
          const pts = [];
          for (let i = 0; i < 70; i++) {
            const a = (i / 70) * Math.PI * 2;
            pts.push([W / 2 + (Math.cos(a) * w) / 2, 20 + h / 2 + (Math.sin(a) * h) / 2]);
          }
          pathFrom(c, tornPath(pts, 1.6, 6));
          c.fill();
          // queue de la bulle
          c.beginPath();
          const bx = tailLeft ? W * 0.3 : W * 0.7;
          c.moveTo(bx - 26, 20 + h * 0.9);
          c.lineTo(bx + (tailLeft ? -40 : 40), H - 8);
          c.lineTo(bx + 30, 20 + h * 0.86);
          c.closePath();
          c.fill();
          c.save();
          c.clip();
          c.restore();
          c.fillStyle = fg;
          c.font = `700 ${size}px "Hyundai Sans Head"`;
          c.textAlign = "center";
          c.textBaseline = "middle";
          c.fillText(text, W / 2, 20 + h / 2 + size * 0.05);
          return withShadow({ cv, w: W, h: H });
        }
        function logoTag() {
          const [cv, c] = mk(176, 168);
          c.fillStyle = PAPER;
          pathFrom(c, tornPath(rectPts(6, 6, 164, 156), 1.6, 5));
          c.fill();
          if (IMG_LOGO) c.drawImage(IMG_LOGO, 22, 18, 132, 122);
          return withShadow({ cv, w: 176, h: 168 });
        }
        function greenMap() {
          const S = 1.62;

            drawSprite(e, p);
            if (e === eMap) {
              // confettis bronze : les 71 points du logo
              for (let i = 0; i < MAP.dots.length; i++) {
                if (Q(t) < dotT[i]) continue;
                const [lx, ly] = MAP.dots[i];
                const [x, y] = toTable(p, lx, ly);
                const k = Math.round((Q(t) - dotT[i]) * FPS);
                const dp = { x, y, rot: hash(i * 7) * 6, s: k === 0 ? 1.25 : 1, h: k === 0 ? 20 : 0, a: 1, rev: 1 };
                drawSprite({ spr: DOT }, dp);
              }
            }
            for (const pie of PIES) if (pie.e === e) drawPie(pie, t);
            if (e === eBureau) for (const s of STRINGS) drawString(s, t);
          }
          for (const a of ARROWS) drawPath(a, t);
          // carte de fin : la feuille blanche, dans le repère de l'écran
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          const ps = pose(eSheet, t);
          if (ps) {
            drawSprite(eSheet, ps);
            for (const tp of SHEET_TAPES) {
              const pt = pose(tp, t);
              if (pt) drawSprite(tp, pt);
            }
          }
          // lumière de prise de vue : vignette douce
          const vg = ctx.createRadialGradient(960, 520, 420, 960, 540, 1250);
          vg.addColorStop(0, "rgba(60,40,10,0)");
          vg.addColorStop(1, "rgba(60,40,10,0.26)");
          ctx.fillStyle = vg;
          ctx.fillRect(0, 0, 1920, 1080);
        }

        host.render = render;
        render(host.clock.t);
        host.ready();
      })();
    </script>
  </body>
</html>
