  <script>
    (function () {
      var C = window.__BG_CUES;
      var P = window.BGP;
      var K = window.CAST;
      var B = window.BG;
      var L = C.local("s3");
      var D = C.sc.s3.dur;
      document.getElementById("s3-mk").innerHTML = B.mark(40);
      document.getElementById("s3-co").innerHTML = B.company(200);
      document.getElementById("s3-st").innerHTML = B.state(260);
      document.getElementById("s3-stack").innerHTML = B.stack(110, 4);
      document.getElementById("s3-endStack").innerHTML = B.stack(72, 4);
      var ic = "";
      [860, 1110, 1360].forEach(function (x, i) {
        ic += '<div id="s3-i' + i + '" class="s3-abs" style="left:' + (x - 24) + 'px;top:352px">' + B.coin(48) + "</div>";
      });
      document.getElementById("s3-ic").innerHTML = ic;
      var S = 0.78,
        FEET = 1004;
      document.getElementById("s3-nadia").innerHTML = P.front("n3", K.with("nadia", { x: 300, y: FEET - 304 * S, s: S, legs: true }));
      P.prep("n3");

      var tl = gsap.timeline({ paused: true });
      tl.fromTo(".s3-kick", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" }, 0.1);
      tl.fromTo("#s3-nadia", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.05);
      tl.fromTo("#s3-stack", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.25);
      tl.fromTo("#s3-title span", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, stagger: 0.14, ease: "power4.out" }, L(C.at("L04", ["une"])) - 0.1);
      P.breathe(tl, "n3", 0, D, 3.1, 0.009);
      P.blink(tl, "n3", [1.4, 5.9]);
      // l'entreprise et l'État, sur leur mot
      var tE = L(C.at("L04", ["entreprise"])) - 0.2,
        tS = L(C.at("L04", ["etat"])) - 0.2;
      tl.fromTo(["#s3-co", "#s3-n1"], { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, tE);
      tl.fromTo(["#s3-st", "#s3-n2"], { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, tS);
      // « un prêt » : la pile de pièces part vers les emprunteurs
      var tP = L(C.at("L04", ["pret"])) - 0.1;
      tl.fromTo("#s3-frise", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, tP - 0.1);
      tl.fromTo("#s3-line", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 1.6, ease: "power2.inOut" }, tP);
      tl.to("#s3-stack", { x: 1090, duration: 1.2, ease: "power2.inOut" }, tP + 0.1);
      tl.to("#s3-stack", { y: -150, duration: 0.6, ease: "power2.out" }, tP + 0.1);
      tl.to("#s3-stack", { y: 30, duration: 0.6, ease: "power2.in" }, tP + 0.7);
      tl.to("#s3-stack", { opacity: 0, scale: 0.6, duration: 0.3, ease: "power2.in" }, tP + 1.15);
      tl.to("#n3-uaR", { rotation: -24, duration: 0.45, ease: "power2.inOut" }, tP);
      tl.to("#n3-uaR", { rotation: 0, duration: 0.6, ease: "power2.inOut" }, tP + 1.2);
      // « des intérêts » : trois pièces se posent sur la frise
      var tI = L(C.at("L04", ["interets"])) - 0.25;
      for (var k = 0; k < 3; k++) tl.fromTo("#s3-i" + k, { opacity: 0, y: -40, scale: 0.6 }, { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: "back.out(2)" }, tI + k * 0.16);
      tl.fromTo("#s3-p1", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, tI + 0.1);
      // « puis vous rembourse à l'échéance »
      var tR = L(C.at("L04", ["rembourse"])) - 0.2;
      tl.fromTo("#s3-endStack", { opacity: 0, y: -30, scale: 0.6 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "back.out(2)" }, tR);
      tl.fromTo("#s3-p2", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, L(C.at("L04", ["lecheance"])) - 0.2);
      tl.to("#n3-mouth", { scaleX: 1.12, scaleY: 1.35, duration: 0.35, ease: "power2.out" }, tR + 0.3);

      tl.to(["#s3-title", ".s3-kick", "#s3-frise", ".s3-name"], { opacity: 0, filter: "blur(6px)", duration: 0.32, ease: "power3.in" }, D - 0.36);
      tl.to(["#s3-nadia", "#s3-co", "#s3-st"], { opacity: 0, duration: 0.32, ease: "power2.in" }, D - 0.34);
      window.__timelines["s3"] = tl;
    })();
  </script>
