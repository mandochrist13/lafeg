      var D = C.sc.s2.dur;
      document.getElementById("s2-mk").innerHTML = B.mark(40);
      document.getElementById("s2-cmk").innerHTML = B.mark(44);
      document.getElementById("s2-bld").innerHTML = B.company(380, "s2p");
      document.getElementById("s2-i1").innerHTML = B.check(40);
      document.getElementById("s2-i2").innerHTML = B.coin(40);
      var S = 0.9,
        FEET = 1004;
      document.getElementById("s2-nadia").innerHTML = P.front("n2", K.with("nadia", { x: 440, y: FEET - 304 * S, s: S, legs: true }));

      var coins = "";
      for (var i = 0; i < 3; i++) coins += '<div id="s2-c' + i + '" class="s2-abs" style="left:1500px;top:600px">' + B.coin(54) + "</div>";

      // « une part » : une part de l'immeuble s'allume, puis le titre d'action rejoint Nadia

      tl.to("#s2-card", { x: 0, y: 0, scale: 1, duration: 0.9, ease: "power3.inOut" }, tP + 0.5);
      tl.to("#s2p-4 rect:first-child", { fill: "#E3EAF1", duration: 0.5, ease: "power2.inOut" }, tP + 1.2);
      // Nadia lève la main vers son titre
